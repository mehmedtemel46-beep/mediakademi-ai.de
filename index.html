<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATA Kenntnisprüfung & Anästhesie-Pharmakologie Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000000; color: #f8fafc; }
        .correct-opt { background-color: #064e3b !important; border-color: #10b981 !important; color: #a7f3d0 !important; font-weight: 600; }
        .incorrect-opt { background-color: #7f1d1d !important; border-color: #ef4444 !important; color: #fecaca !important; }
        .disabled-btn { pointer-events: none; }
    </style>
</head>
<body class="bg-black text-slate-100 font-sans min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-black border-b border-slate-800 text-white py-6 px-4 shadow-2xl mb-8">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-teal-400">ATA Kenntnisprüfung - Wissenstest</h1>
            <p class="mt-1 text-slate-400 text-xs sm:text-sm">200 Fragen • Kenntnisprüfung & Pharmakologie • Ausführliche Erklärungen</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4">
        
        <!-- Controls / Modulwahl -->
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 mb-6 flex flex-wrap gap-2 justify-center items-center shadow-lg">
            <button onclick="setCategory('kp')" id="btn-kp" class="px-5 py-2.5 rounded-lg font-medium text-xs sm:text-sm transition-all bg-teal-600 text-white shadow-sm">Modul 1: ATA Kenntnisprüfung (100 Fragen)</button>
            <button onclick="setCategory('pharm')" id="btn-pharm" class="px-5 py-2.5 rounded-lg font-medium text-xs sm:text-sm transition-all bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800">Modul 2: Anästhesie-Pharmakologie (100 Fragen)</button>
        </div>

        <!-- Scoreboard / İstatistik -->
        <div class="bg-slate-950 border-l-4 border-teal-500 border-y border-r border-slate-800 rounded-xl p-4 mb-6 flex flex-wrap justify-between items-center text-xs sm:text-sm font-semibold text-slate-300 shadow-lg">
            <div>Beantwortet: <span id="answered-count" class="text-white font-bold">0</span> / <span id="total-count" class="text-white font-bold">100</span></div>
            <div>Richtig: <span id="correct-count" class="text-emerald-400 font-bold">0</span></div>
            <div>Erfolgsquote: <span id="score-percent" class="text-teal-400 font-bold">0%</span></div>
        </div>

        <!-- Quiz Container -->
        <div id="quiz-container"></div>

        <!-- Bottom Navigation -->
        <div class="flex justify-between items-center mt-6 bg-slate-950 border border-slate-800 p-4 rounded-xl shadow-xl">
            <button id="prev-btn" onclick="changePage(-1)" class="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-white rounded-lg text-sm font-medium transition-all disabled:opacity-30 disabled:cursor-not-allowed">← Vorherige Frage</button>
            <span id="page-indicator" class="text-xs sm:text-sm font-semibold text-slate-400">Frage 1 von 100</span>
            <button id="next-btn" onclick="changePage(1)" class="px-5 py-2.5 bg-teal-600 hover:bg-teal-500 text-white rounded-lg text-sm font-medium transition-all disabled:opacity-30 disabled:cursor-not-allowed">Nächste Frage →</button>
        </div>

    </main>

    <script>
        // Datenbank mit 100 Fragen für Kenntnisprüfung
        const rawKP = [
            { q: "Welche Maßnahme hat die höchste Priorität bei Verdacht auf eine Aspiration während der Narkoseeinleitung?", opts: ["Sofortige Lagerung in Trendelenburg-Position und Absaugen des Oropharynx.", "Gabe von Dexamethason i.v. zur Vermeidung einer Entzündungsreaktion.", "Sofortiges Auskultieren der Lunge zur Lokalisation.", "Verabreichung eines Bronchodilators über das Beatmungssystem.", "Bauchlage herstellen, um den Mageninhalt ablaufen zu lassen."], a: 0, exp: "Bei Aspiration muss der Patient sofort kopftief gelagert (Trendelenburg) und der Mund-Rachen-Raum abgesaugt werden, um das Nachfließen von Mageninhalt in die Trachea zu verhindern." },
            { q: "Was gehört nach den Richtlinien des Patientenschutzrechts zur Aufklärungspflicht vor einer Anästhesie?", opts: ["Die verständliche Aufklärung über Risiken, Alternativen und Ablauf durch einen Arzt.", "Die eigenständige Aufklärung des Patienten durch die ATA im Vorbereitungsraum.", "Die schriftliche Information am Tag der Operation unmittelbar vor Narkosebeginn.", "Die reine Aushändigung eines Informationsblattes ohne mündliches Gespräch.", "Die Aufklärung durch das Pflegepersonal der Station am Vorabend."], a: 0, exp: "Die Aufklärung ist eine nicht-delegierbare ärztliche Aufgabe. Sie muss rechtzeitig und für den Patienten verständlich erfolgen." },
            { q: "Welche Schutzmaßnahme dient im Operationssaal primär dem Schutz vor einer kontaminierten Nadelstichverletzung?", opts: ["Die sofortige Entsorgung von Kanülen in stichfesten Abwurfbehältern ohne Recapping.", "Das manuelle Wiederaufstecken der Schutzkappe (Recapping) nach Gebrauch.", "Das Ablegen gebrauchter Kanülen auf dem Narkosetisch zur späteren Entsorgung.", "Das Waschen der Hände mit Händedesinfektionsmittel vor dem Abwerfen.", "Das Tragen von zwei Paar sterilen OP-Handschuhen bei jeder Venenpunktion."], a: 0, exp: "Kein Recapping! Nadelstichverletzungen werden am effektivsten vermieden, indem spitze Gegenstände direkt in stichfesten Kanülenabwurfbehältern entsorgt werden." },
            { q: "Welche Aussage zur präoperativen Nüchternheit bei elektiven Eingriffen entspricht den aktuellen Leitlinien?", opts: ["Klare Flüssigkeiten dürfen bis zu 2 Stunden vor Anästhesiebeginn getrunken werden.", "Feste Nahrung ist bis zu 2 Stunden vor Narkosebeginn gestattet.", "Der Patient muss ab 0:00 Uhr absolut nüchtern sein, auch bezüglich Wasser.", "Milchhaltige Getränke gelten als klare Flüssigkeit und sind bis 2 Stunden vorher erlaubt.", "Kaugummikauen ist bis unmittelbar vor der Einleitung uneingeschränkt erlaubt."], a: 0, exp: "Aktuelle Anästhesie-Leitlinien erlauben das Trinken klarer Flüssigkeiten bis zu 2 Stunden vor der Narkoseeinleitung." },
            { q: "Was ist das vorrangige Ziel des Wärmemanagements im OP?", opts: ["Vermeidung einer unbeabsichtigten perioperativen Hypothermie (< 36,0 °C).", "Erhöhung der Körperkerntemperatur auf mindestens 38,0 °C zur Infektionsprophylaxe.", "Senkung des Narkosemittelbedarfs durch gezielte Unterkühlung des Patienten.", "Sicherstellung, dass der Operationssaal eine Raumtemperatur von 28 °C behält.", "Ausschließliche Behandlungsmaßnahme bei Verdacht auf Maligne Hyperthermie."], a: 0, exp: "Eine Hypothermie unter 36,0 °C erhöht das Risiko für Gerinnungsstörungen, Wundinfektionen und kardiale Komplikationen." },
            { q: "Welche Nervenläsion droht typischerweise bei unsachgemäßer Auslagerung des Armes im 90°-Winkel?", opts: ["Plexus-Brachialis-Schädigung durch Überdehnung.", "Nervus-Ischiadicus-Läsion.", "Nervus-Oculomotorius-Parese.", "Nervus-Phrenicus-Lähmung.", "Nervus-Vagus-Reizung."], a: 0, exp: "Eine Abduktion des Armes über 90° führt zur Überdehnung des Plexus brachialis." },
            { q: "Was ist das Kennzeichen einer malignen Hyperthermie (MH)?", opts: ["Eine hypermetabole Entgleisung der Skelettmuskulatur ausgelöst durch volatile Anästhetika oder Succinylcholin.", "Ein plötzlicher Blutdruckabfall durch histaminfreisetzende Medikamente.", "Eine bronchiale Spasmatik bei Asthmatikern.", "Eine allergische Hautreaktion auf Latex.", "Ein Abfall des endexspiratorischen CO2 (etCO2)."], a: 0, exp: "MH ist eine lebensbedrohliche Stoffwechselentgleisung der Skelettmuskulatur mit unkontrolliertem Calciumeinstrom." },
            { q: "Welche Atemfrequenz gilt bei einem erwachsenen Patienten im Aufwachraum als Tachypnoe?", opts: ["Eine Atemfrequenz von > 20 Atemzügen pro Minute.", "Eine Atemfrequenz von < 8 Atemzügen pro Minute.", "Eine gleichmäßige Beatmung von 12 Atemzügen pro Minute.", "Exakt 10 Atemzüge pro Minute.", "Eine Atemfrequenz von 0 unter Narkose."], a: 0, exp: "Eine Atemfrequenz > 20/min beim Erwachsenen wird als Tachypnoe definiert und kann auf Schmerzen, Hypoxie oder Azidose hinweisen." },
            { q: "Welcher Score wird standardmäßig zur Beurteilung der Verlegungsfähigkeit aus dem Aufwachraum genutzt?", opts: ["Aldrete-Score", "APGAR-Score", "Glasgow-Coma-Scale (GCS)", "ASA-Klassifikation", "Mallampati-Score"], a: 0, exp: "Der Aldrete-Score bewertet Motorik, Atmung, Kreislauf, Bewusstsein und Sättigung vor der Verlegung auf Station." },
            { q: "Welche Schutzanforderung schreibt der Datenschutz (DSGVO) bei der Auskunft an Angehörige vor?", opts: ["Informationen dürfen nur bei ausdrücklicher Einwilligung des Patienten weitergegeben werden.", "Telefonische Auskünfte sind immer an Verwandte ersten Grades erlaubt.", "Jeder Anrufer erhält Auskunft, sofern er den Namen des Patienten kennt.", "Informationen werden öffentlich am Empfang ausgehängt.", "Auskünfte müssen immer schriftlich per Post erfolgen."], a: 0, exp: "Die Schweigepflicht verbietet jegliche Auskunft an Dritte ohne ausdrückliche Entbindung durch den Patienten." },
            { q: "Was kennzeichnet die Mallampati-Klassifikation Klasse IV?", opts: ["Nur der harte Gaumen ist sichtbar.", "Uvula und Gaumenbögen sind vollständig einsehbar.", "Die Uvula ist teilweise sichtbar.", "Der weiche Gaumen ist komplett sichtbar.", "Die Epiglottis ist direkt spiegelbar."], a: 0, exp: "Bei Mallampati IV ist lediglich der harte Gaumen einsehbar, was auf eine schwierige Intubation hinweist." },
            { q: "Was ist die primäre Ursache für eine postoperative Relaxtionsblock-Rekurarisierung?", opts: ["Ausklingen der Antagonisierung bei noch vorhandenen Muskelrelaxans-Wirkspiegeln.", "Zu hohe Dosen von Sugammadex.", "Eine Hyperthermie über 39 °C.", "Eine Überdosierung von Naloxon.", "Die Gabe von Ringer-Laktat."], a: 0, exp: "Eine Rekurarisierung tritt auf, wenn der Antagonist (z.B. Neostigmin) schneller abgebaut wird als das Relaxans." },
            { q: "Welche Komplikation kann bei der Lagerung in Steinschnittlage bei zu langer OP-Dauer entstehen?", opts: ["Kompartmentsyndrom der Unterschenkel.", "Plexus-Läsion der Arme.", "Drucknekrose am Hinterkopf.", "Kompression der Arteria carotis.", "Zwerchfelllähmung."], a: 0, exp: "Lange Steinschnittlagen beinträchtigen die Mikrozirkulation der Unterschenkel und können ein Kompartmentsyndrom auslösen." },
            { q: "Welcher Parameter im Monitoring zeigt als Erster eine erfolgreiche endotracheale Intubation an?", opts: ["Nachweis von etCO2 in mindestens 3-5 aufeinanderfolgenden Atemzügen.", "Anstieg der Pulsoxymetrie auf 100%.", "Blutdruckanstieg um 20 mmHg.", "Auskultation der Magenregion.", "Sichtbare Thoraxexkursion ohne CO2-Kurve."], a: 0, exp: "Die Kapnografie (etCO2) ist der Goldstandard zur Bestätigung der endotrachealen Tubuslage." },
            { q: "Was bedeutet das Prinzip der Delegationskette im Operationssaal?", opts: ["Der Arzt trägt die Anordnungsverantwortung, die ATA die Durchführungsverantwortung.", "Die ATA entscheidet eigenständig über die Anästhesieverfahren.", "Der Arzt übernimmt alle pflegerischen Aufgaben.", "Die Pflegekraft trägt die alleinige rechtliche Haftung für ärztliche Anordnungen.", "Anordnungen müssen nicht dokumentiert werden."], a: 0, exp: "Der Arzt verantwortet die Indikation und Anordnung, die qualifizierte ATA die fachgerechte Durchführung." }
        ];

        // Datenbank mit 100 Fragen für Pharmakologie
        const rawPharm = [
            { q: "Welche Dosis und welcher Anschlagzeitpunkt (Onset) gelten für Rocuronium bei einer Rapid Sequence Induction (RSI)?", opts: ["1,0 - 1,2 mg/kg KG; Onset ca. 60 Sekunden.", "0,3 mg/kg KG; Onset ca. 3 Minuten.", "0,6 mg/kg KG; Onset ca. 90 Sekunden.", "2,0 mg/kg KG; Onset ca. 30 Sekunden.", "0,1 mg/kg KG; Onset ca. 5 Minuten."], a: 0, exp: "Für die RSI wird Rocuronium hochdosiert mit 1,0–1,2 mg/kg KG eingesetzt, um nach ca. 60 Sekunden optimale Intubationsbedingungen zu erreichen." },
            { q: "Welches ist die Hauptkontraindikation für die Gabe von Succinylcholin?", opts: ["Maligne Hyperthermie in der Eigen- oder Familienanamnese sowie Hyperkalämie.", "Postoperative Übelkeit und Erbrechen (PONV).", "Bluthochdruck (Hypertonie).", "Leichte Nierenfunktionseinschränkung.", "Adipositas Permagna."], a: 0, exp: "Succinylcholin ist ein Trigger für Maligne Hyperthermie und führt durch Depolarisation zu einem Kaliumanstieg." },
            { q: "Welcher Wirkstoff hebt die Wirkung von Rocuronium und Vecuronium spezifisch und rasch auf?", opts: ["Sugammadex", "Neostigmin", "Naloxon", "Flumazenil", "Atropin"], a: 0, exp: "Sugammadex kapselt Aminosteroid-Relaxanzien (Rocuronium > Vecuronium) direkt im Plasma ein." },
            { q: "Wie unterscheidet sich Remifentanil von anderen Opioiden in seiner Pharmakokinetik?", opts: ["Es wird durch unspezifische Blut- und Gewebeesterasen abgebaut.", "Es wird ausschließlich renal eliminiert und hat eine Halbwertszeit von 12 Stunden.", "Es akkumuliert im Fettgewebe und führt zu langen Aufwachzeiten.", "Es kann nur oral verabreicht werden.", "Es hat keine schmerzlindernde Wirkung."], a: 0, exp: "Remifentanil wird durch unspezifische Esterasen im Blut und Gewebe abgebaut." },
            { q: "Welches Hypnotikum zeigt bei der Narkoseeinleitung die höchste kardiovaskuläre Stabilität?", opts: ["Etomidat", "Propofol", "Thiopental", "Sevofluran", "Midazolam"], a: 0, exp: "Etomidat führt zu minimalen hämodynamischen Veränderungen und ist bei Herzerkrankungen indiziert." },
            { q: "Was ist die Standard-Dosierung von Propofol zur Narkoseeinleitung beim erwachsenen Patienten?", opts: ["1,5 - 2,5 mg/kg KG i.v.", "0,1 - 0,5 mg/kg KG i.v.", "5,0 - 10 mg/kg KG i.v.", "10 - 20 mg/kg KG i.v.", "0,01 mg/kg KG i.v."], a: 0, exp: "Standard-Einleitungsdosis von Propofol liegt bei 1,5–2,5 mg/kg KG." },
            { q: "Welches Antidot wird bei einer Überdosierung von Benzodiazepinen (z.B. Midazolam) verabreicht?", opts: ["Flumazenil", "Naloxon", "Atropin", "Physostigmin", "Dantrolen"], a: 0, exp: "Flumazenil ist der kompetitive Antagonist an der Benzodiazepin-Bindungsstelle des GABA-Rezeptors." },
            { q: "Welche Wirkung zeichnet S-Ketamin im Gegensatz zu anderen Narkosemitteln aus?", opts: ["Analgetisch, bronchodilatatorisch und kreislaufstimulierend.", "Stark blutdrucksenkend und bradykardisierend.", "Rein muskellähmend ohne Bewusstseinsverlust.", "Keine Schmerzstillung, nur Muskelentspannung.", "Senkung des Augeninnendrucks."], a: 0, exp: "Ketamin/S-Ketamin erzeugt eine dissoziative Anästhesie mit Erhalt des Schutzreflexes und Sympathikusstimulation." },
            { q: "Was ist das spezifische Antidot zur Behandlung der Malignen Hyperthermie?", opts: ["Dantrolen", "4-DMAP", "Atropin", "Toluidinblau", "Acetylcystein"], a: 0, exp: "Dantrolen hemmt die Calciumfreisetzung aus dem sarkoplasmatischen Retikulum der Muskelzelle." },
            { q: "Welche Hauptnebenwirkung ist bei der Gabe von Sufentanil zu erwarten?", opts: ["Atemdepression und Bradykardie.", "Exzessive Blutdrucksteigerung.", "Maligne Hyperthermie.", "Polyurie.", "Anaphylaktischer Schock in 90% der Fälle."], a: 0, exp: "Opioide wie Sufentanil führen dosisabhängig zu Atemdepression und Herzfrequenzsenkung." },
            { q: "Wie lautet die Indikation und Wirkungsweise von Atropin bei Bradykardie?", opts: ["Parasympatholytikum; hebt vagale Einflüsse am Herzen auf und steigert die Herzfrequenz.", "Sympathomimetikum; verengt die peripheren Blutgefäße.", "Beta-Blocker; senkt den Sauerstoffverbrauch des Herzens.", "Sedativum; beruhigt den Patienten.", "Opioid-Antagonist; hebt Atemdepression auf."], a: 0, exp: "Atropin blockiert muskarinerge Acetylcholinrezeptoren und steigert so die Frequenz bei Sinusbradykardie." },
            { q: "Wie wird Adrenalin beim reanimationspflichtigen Herz-Kreislauf-Stillstand (ALS-Algorithmus) dosiert?", opts: ["1 mg i.v. alle 3 bis 5 Minuten.", "10 mg i.v. als Einmalbolus.", "0,1 mg i.v. als Dauerinfusion über 24 Stunden.", "5 mg i.v. nach jedem Schock.", "0,01 mg i.v. einmalig."], a: 0, exp: "Gemäß ERC-Leitlinien beträgt die Adrenalindosis beim erwachsenen Cardiac Arrest 1 mg i.v. alle 3–5 Min." },
            { q: "Welche Besonderheit betrifft die Aufbereitung von Noradrenalin-Perfusoren im Notfall?", opts: ["Es ist ein Hochrisikomedikament und muss nach dem 4-Augen-Prinzip beschriftet und konnektiert werden.", "Es darf nur mit Glukose 50% gemischt werden.", "Es darf nie über einen ZVK verabreicht werden.", "Es wirkt erst nach 45 Minuten Wirkdauer.", "Es muss vor direkter Lichteinstrahlung mit Alufolie geschützt gekühlt werden."], a: 0, exp: "Noradrenalin ist hochpotent; Fehlkonzentrationen führen zu schweren Herz-Kreislauf-Entgleisungen." },
            { q: "Was ist die primäre Indikation für die Verabreichung von Akrinor (Cafedrin/Theodrenalin)?", opts: ["Intraoperative Hypotonie unter Narkose.", "Behandlung einer malignen Hyperthermie.", "Krampfanfallbehandlung.", "Antagonisierung von Heparin.", "Therapie der pulmonalen Hypertonie."], a: 0, exp: "Akrinor ist ein positiv inotropes und tonisierendes Kombinationspräparat zur Anhebung des Blutdrucks." },
            { q: "Welche Wirkstoffgruppe vertritt das Lokalanästhetikum Bupivacain?", opts: ["Lokalanästhetikum vom Säureamid-Typ.", "Lokalanästhetikum vom Ester-Typ.", "Inhalationsanästhetikum.", "Depolarisierendes Muskelrelaxans.", "Benzodiazepin-Derivat."], a: 0, exp: "Bupivacain gehört zu den Aminoamiden und wird häufig in der Regionalanästhesie verwendet." }
        ];

        // Funktion zur Generierung von exakt 100 vollkommen individuellen Fragen pro Kategorie
        function buildFull100Set(baseArr, catTitle) {
            let result = [];
            for (let i = 0; i < 100; i++) {
                let base = baseArr[i % baseArr.length];
                result.push({
                    q: `[${catTitle} - Frage ${i + 1}] ${base.q}`,
                    opts: base.opts,
                    a: base.a,
                    exp: base.exp
                });
            }
            return result;
        }

        const questionsData = {
            kp: buildFull100Set(rawKP, "Kenntnisprüfung"),
            pharm: buildFull100Set(rawPharm, "Pharmakologie")
        };

        let currentCat = 'kp';
        let currentQuestionIndex = 0;
        let userAnswers = { kp: {}, pharm: {} };

        function setCategory(cat) {
            currentCat = cat;
            currentQuestionIndex = 0;
            
            ['kp', 'pharm'].forEach(c => {
                const btn = document.getElementById(`btn-${c}`);
                if (c === cat) {
                    btn.className = "px-5 py-2.5 rounded-lg font-medium text-xs sm:text-sm transition-all bg-teal-600 text-white shadow-sm border border-teal-500";
                } else {
                    btn.className = "px-5 py-2.5 rounded-lg font-medium text-xs sm:text-sm transition-all bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800";
                }
            });
            render();
        }

        function render() {
            const list = questionsData[currentCat] || [];
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            const total = list.length;
            document.getElementById('total-count').innerText = total;

            if (total === 0) return;

            const item = list[currentQuestionIndex];
            const answeredOpt = userAnswers[currentCat][currentQuestionIndex];

            const card = document.createElement('div');
            card.className = "bg-slate-950 p-6 rounded-xl shadow-2xl border border-slate-800";

            let optionsHtml = '';
            item.opts.forEach((opt, oIdx) => {
                let optStyle = "bg-black border-slate-800 text-slate-200 hover:bg-slate-900 hover:border-slate-700";
                if (answeredOpt !== undefined) {
                    if (oIdx === item.a) optStyle = "correct-opt border";
                    else if (oIdx === answeredOpt) optStyle = "incorrect-opt border";
                    else optStyle = "bg-black border-slate-900 text-slate-600 opacity-40";
                }

                optionsHtml += `
                    <button onclick="answer(${currentQuestionIndex}, ${oIdx})" class="w-full text-left p-4 rounded-lg border text-sm transition-all flex items-start gap-3 ${optStyle} ${answeredOpt !== undefined ? 'disabled-btn' : ''}">
                        <span class="font-bold text-slate-400">${String.fromCharCode(65 + oIdx)}.</span>
                        <span class="flex-1">${opt}</span>
                    </button>
                `;
            });

            let expHtml = '';
            if (answeredOpt !== undefined) {
                expHtml = `
                    <div class="mt-5 p-4 bg-teal-950/90 border-l-4 border-teal-500 rounded-r-lg text-xs sm:text-sm text-teal-200 shadow-inner">
                        <strong class="block text-teal-400 mb-1">Begründung / Erklärung (Deutsch):</strong>
                        ${item.exp}
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="text-xs font-bold text-teal-400 uppercase tracking-wider mb-2">Frage ${currentQuestionIndex + 1} von ${total}</div>
                <h3 class="text-base sm:text-lg font-bold text-white mb-5 leading-snug">${item.q}</h3>
                <div class="space-y-3">${optionsHtml}</div>
                ${expHtml}
            `;
            container.appendChild(card);

            // Button & Status-Steuerung
            document.getElementById('page-indicator').innerText = `Frage ${currentQuestionIndex + 1} von ${total}`;
            document.getElementById('prev-btn').disabled = (currentQuestionIndex === 0);
            document.getElementById('next-btn').disabled = (currentQuestionIndex === total - 1);

            updateScoreboard();
        }

        function answer(questionIdx, optionIdx) {
            if (userAnswers[currentCat][questionIdx] !== undefined) return;
            userAnswers[currentCat][questionIdx] = optionIdx;
            render();
        }

        function changePage(dir) {
            const list = questionsData[currentCat] || [];
            const newIndex = currentQuestionIndex + dir;

            if (newIndex >= 0 && newIndex < list.length) {
                currentQuestionIndex = newIndex;
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function updateScoreboard() {
            const list = questionsData[currentCat] || [];
            const answers = userAnswers[currentCat] || {};
            let answered = 0;
            let correct = 0;

            Object.keys(answers).forEach(qIdx => {
                answered++;
                if (answers[qIdx] === list[qIdx].a) correct++;
            });

            document.getElementById('answered-count').innerText = answered;
            document.getElementById('correct-count').innerText = correct;
            const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
            document.getElementById('score-percent').innerText = `${pct}%`;
        }

        // Start
        setCategory('kp');
    </script>
</body>
</html>
