      function App() {
        const [activeTab, setActiveTab] = useState('quiz'); // quiz, equipment, meds, pacu, dialogues, ai
        const [selectedEquipCategory, setSelectedEquipCategory] = useState(0);

        // Quiz State
        const [questionsList, setQuestionsList] = useState(DEFAULT_20_QUESTIONS);
        const [currentQ, setCurrentQ] = useState(0);
        const [selectedOption, setSelectedOption] = useState(null);
        const [score, setScore] = useState(0);
        const [showExplanation, setShowExplanation] = useState(false);
        const [quizFinished, setQuizFinished] = useState(false);
        const [aiGeneratingQuestions, setAiGeneratingQuestions] = useState(false);

        // AI State
        const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
        const [isApiKeySaved, setIsApiKeySaved] = useState(!!localStorage.getItem('gemini_api_key'));
        const [aiResponse, setAiResponse] = useState('');
        const [loading, setLoading] = useState(false);

        const handleSaveApiKey = () => {
          localStorage.setItem('gemini_api_key', apiKey);
          setIsApiKeySaved(true);
        };

        const generate20QuestionsWithAI = async () => {
          if (!apiKey) {
            alert("Bitte geben Sie zuerst Ihren Gemini API-Schlüssel ein!");
            return;
          }
          setAiGeneratingQuestions(true);

          const prompt = `Erstelle genau 10-20 anspruchsvolle Multiple-Choice-Fragen auf Deutsch für die Anästhesietechnische Assistent (ATA) Kenntnisprüfung (KP) in Deutschland.
          Themen: Anästhesie-Pharmakologie (Hypnotika, Opioide, Relaxanzien, Lokalanästhetika, Katecholamine), Aufwachraum-Management, Lagerungsschäden, Beatmungssysteme.

          Antworte STRENG als JSON-Array ohne Codeblock-Tags:
          [
            {
              "question": "Fragetext auf Deutsch",
              "options": ["Option A", "Option B", "Option C", "Option D"],
              "answer": 0,
              "explanation": "Klinische Begründung auf Deutsch"
            }
          ]`;

          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            const text = data.candidates[0].content.parts[0].text;
            const cleanJson = text.replace(/```json|```/g, '').trim();
            const newQuestions = JSON.parse(cleanJson);

            if (Array.isArray(newQuestions) && newQuestions.length > 0) {
              setQuestionsList(newQuestions);
              resetQuiz();
              alert("✨ Neue KI-Prüfungsfragen wurden erfolgreich geladen!");
            }
          } catch (err) {
            alert("Fehler beim Generieren der Fragen: " + err.message);
          } finally {
            setAiGeneratingQuestions(false);
          }
        };

        const handleOptionClick = (index) => {
          if (selectedOption !== null) return;
          setSelectedOption(index);
          setShowExplanation(true);
          if (index === questionsList[currentQ].answer) {
            setScore(score + 1);
          }
        };

        const handleNextQuestion = () => {
          setSelectedOption(null);
          setShowExplanation(false);
          if (currentQ + 1 < questionsList.length) {
            setCurrentQ(currentQ + 1);
          } else {
            setQuizFinished(true);
          }
        };

        const resetQuiz = () => {
          setCurrentQ(0);
          setSelectedOption(null);
          setScore(0);
          setShowExplanation(false);
          setQuizFinished(false);
        };

        const generateAICase = async () => {
          if (!apiKey) {
            alert("Bitte geben Sie Ihren API-Schlüssel ein.");
            return;
          }
          setLoading(true);
          setAiResponse('');

          const prompt = `Erstelle ein hochkomplexes klinisches Fallbeispiel (Prüfungsfall für Kenntnisprüfung KP in Deutschland) für einen Anästhesietechnischen Assistenten (ATA).
          Themenbereich: Anästhesieführung, Komplikation im Aufwachraum oder Schmerztherapie.
          
          Struktur auf Deutsch:
          1. PATIENTENDATEN & ANAMNESE
          2. VITALPARAMETER & BEFUND
          3. AKUTE KOMPLIKATION
          4. 3 PRÜFUNGSFRAGEN (Pharmakologie, Atemweg, Aufwachraum)
          5. MUSTERLÖSUNG FÜR PRÜFER.`;

          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
              setAiResponse(data.candidates[0].content.parts[0].text);
            }
          } catch (err) {
            setAiResponse("Fehler: " + err.message);
          } finally {
            setLoading(false);
          }
        };

        const optionLabels = ["A", "B", "C", "D"];

        return (
          <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
            {/* Header */}
            <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-6 py-4">
              <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div className="flex items-center gap-3">
                  <span className="text-3xl">🫁</span>
                  <div>
                    <h1 className="text-2xl font-extrabold bg-gradient-to-r from-teal-400 to-cyan-400 bg-clip-text text-transparent">
                      ATA KENNTNISPRÜFUNG
                    </h1>
                    <p className="text-xs text-slate-400">Kompendium & Prüfungs-Trainer</p>
                  </div>
                </div>

                {/* API Key Box */}
                <div className="flex items-center gap-2">
                  <input 
                    type="password" 
                    placeholder="Gemini API Key" 
                    value={apiKey} 
                    onChange={(e) => setApiKey(e.target.value)}
                    className="bg-slate-950 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-800 text-xs focus:outline-none focus:border-teal-500 w-32 md:w-44"
                  />
                  <button 
                    onClick={handleSaveApiKey}
                    className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-teal-400 px-3 py-1.5 rounded-lg text-xs font-semibold"
                  >
                    {isApiKeySaved ? 'Gespeichert ✓' : 'Speichern'}
                  </button>
                </div>
              </div>
            </header>

            {/* Main Navigation */}
            <div className="bg-slate-900 border-b border-slate-800 px-6">
              <div className="max-w-7xl mx-auto flex overflow-x-auto gap-2 md:gap-4 py-3 no-scrollbar">
                <button
                  onClick={() => setActiveTab('quiz')}
                  className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition ${activeTab === 'quiz' ? 'bg-amber-500/20 border border-amber-500/50 text-amber-400 shadow-lg' : 'text-slate-400 hover:text-white'}`}
                >
                  📝 KP Prüfungstest
                </button>
                <button
                  onClick={() => setActiveTab('meds')}
                  className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition ${activeTab === 'meds' ? 'bg-teal-500/10 border border-teal-500/40 text-teal-400' : 'text-slate-400 hover:text-white'}`}
                >
                  💊 Pharmakologie ({ATA_DATA.meds.length})
                </button>
                <button
                  onClick={() => setActiveTab('pacu')}
                  className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition ${activeTab === 'pacu' ? 'bg-teal-500/10 border border-teal-500/40 text-teal-400' : 'text-slate-400 hover:text-white'}`}
                >
                  🏥 Aufwachraum (PACU) & Schmerz
                </button>
                <button
                  onClick={() => setActiveTab('equipment')}
                  className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition ${activeTab === 'equipment' ? 'bg-teal-500/10 border border-teal-500/40 text-teal-400' : 'text-slate-400 hover:text-white'}`}
                >
                  ⚙️ Systeme & Lagerung
                </button>
                <button
                  onClick={() => setActiveTab('dialogues')}
                  className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition ${activeTab === 'dialogues' ? 'bg-teal-500/10 border border-teal-500/40 text-teal-400' : 'text-slate-400 hover:text-white'}`}
                >
                  🗣️ Kommunikation & Begriffe
                </button>
                <button
                  onClick={() => setActiveTab('ai')}
                  className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition ${activeTab === 'ai' ? 'bg-gradient-to-r from-teal-500 to-cyan-500 text-slate-950 shadow-lg shadow-teal-500/20' : 'text-slate-400 hover:text-white'}`}
                >
                  ✨ KI-Fall-Simulator
                </button>
              </div>
            </div>

            {/* Main Content */}
            <main className="max-w-7xl mx-auto p-6 flex-1 w-full">
              
              {/* TAB: QUIZ */}
              {activeTab === 'quiz' && (
                <div className="max-w-3xl mx-auto space-y-6">
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div>
                      <h4 className="text-sm font-bold text-teal-300">Dynamischer KI-Prüfungsmodus</h4>
                      <p className="text-xs text-slate-400">Generieren Sie neue Fragen zu Medikamenten, AWR und Anästhesietechnik.</p>
                    </div>
                    <button
                      onClick={generate20QuestionsWithAI}
                      disabled={aiGeneratingQuestions}
                      className="bg-gradient-to-r from-amber-500 to-teal-500 hover:opacity-90 text-slate-950 text-xs font-black px-4 py-2.5 rounded-xl transition whitespace-nowrap disabled:opacity-50"
                    >
                      {aiGeneratingQuestions ? 'Generiere Fragen...' : '✨ Neue KI-Fragen laden'}
                    </button>
                  </div>

                  {!quizFinished ? (
                    <div className="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl space-y-6 relative overflow-hidden">
                      <div className="w-full bg-slate-950 h-2 rounded-full overflow-hidden border border-slate-800">
                        <div 
                          className="bg-gradient-to-r from-teal-400 to-amber-400 h-full transition-all duration-300"
                          style={{ width: `${((currentQ + 1) / questionsList.length) * 100}%` }}
                        ></div>
                      </div>

                      <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                        <span className="text-xs font-extrabold text-teal-400 uppercase tracking-wider">
                          Frage {currentQ + 1} von {questionsList.length}
                        </span>
                        <span className="bg-slate-800 text-amber-300 text-xs px-3 py-1 rounded-full font-bold">
                          Punktestand: {score}
                        </span>
                      </div>

                      <h3 className="text-lg md:text-xl font-bold text-slate-100 leading-snug">
                        {questionsList[currentQ].question}
                      </h3>

                      <div className="grid gap-3">
                        {questionsList[currentQ].options.map((opt, idx) => {
                          let btnStyle = "bg-slate-950 border-slate-800 text-slate-300 hover:border-teal-500/50";
                          if (selectedOption !== null) {
                            if (idx === questionsList[currentQ].answer) {
                              btnStyle = "bg-emerald-950/90 border-emerald-500 text-emerald-200 font-bold";
                            } else if (idx === selectedOption) {
                              btnStyle = "bg-rose-950/90 border-rose-500 text-rose-200 font-bold";
                            } else {
                              btnStyle = "bg-slate-950/40 border-slate-900 text-slate-600 opacity-40";
                            }
                          }
                          return (
                            <button
                              key={idx}
                              onClick={() => handleOptionClick(idx)}
                              disabled={selectedOption !== null}
                              className={`w-full text-left p-4 rounded-xl border transition text-sm flex items-center gap-3 ${btnStyle}`}
                            >
                              <span className="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center font-mono font-bold text-xs text-amber-400 shrink-0">
                                {optionLabels[idx]}
                              </span>
                              <span className="flex-1">{opt}</span>
                            </button>
                          );
                        })}
                      </div>

                      {showExplanation && (
                        <div className="space-y-4 pt-4 border-t border-slate-800">
                          <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs text-slate-300 space-y-1">
                            <strong className="text-teal-400 block mb-1">Klinische Erklärung:</strong>
                            {questionsList[currentQ].explanation}
                          </div>
                          <button
                            onClick={handleNextQuestion}
                            className="w-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-extrabold py-3.5 rounded-xl transition shadow-lg shadow-teal-500/20"
                          >
                            {currentQ + 1 < questionsList.length ? 'Nächste Frage →' : 'Testergebnis anzeigen 🏆'}
                          </button>
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center space-y-6">
                      <span className="text-6xl">🏆</span>
                      <h3 className="text-2xl font-black text-teal-300">Prüfung Beendet!</h3>
                      <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800 max-w-sm mx-auto space-y-2">
                        <p className="text-xs text-slate-400 uppercase tracking-widest font-bold">Ergebnis</p>
                        <p className="text-4xl font-extrabold text-amber-400 font-mono">
                          {score} / {questionsList.length}
                        </p>
                      </div>
                      <button
                        onClick={resetQuiz}
                        className="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-6 py-3 rounded-xl transition border border-slate-700"
                      >
                        Test Wiederholen 🔄
                      </button>
                    </div>
                  )}
                </div>
              )}

              {/* TAB: PHARMAKOLOGIE */}
              {activeTab === 'meds' && (
                <div className="space-y-6">
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <p className="text-xs text-slate-400">
                      💡 <strong>KP-Anforderung:</strong> Nennen Sie stets Substanzgruppe, Indikation, Standarddosierung (mg/kg), spezifische Nebenwirkungen und Antidote.
                    </p>
                  </div>
                  <div className="grid md:grid-cols-2 gap-4">
                    {ATA_DATA.meds.map((med, idx) => (
                      <div key={idx} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-3 hover:border-slate-700 transition">
                        <div className="flex justify-between items-start border-b border-slate-800 pb-3">
                          <div>
                            <h4 className="text-xl font-extrabold text-teal-300">{med.name}</h4>
                            <span className="text-xs text-slate-400 font-semibold">{med.group}</span>
                          </div>
                          <span className="bg-teal-500/10 border border-teal-500/30 text-teal-400 text-xs px-2.5 py-1 rounded-full font-mono font-bold">
                            {med.dose}
                          </span>
                        </div>
                        <div className="text-xs space-y-2">
                          <p><strong className="text-slate-300">Wirkung:</strong> <span className="text-slate-400">{med.effect}</span></p>
                          <p><strong className="text-rose-400">Nebenwirkungen:</strong> <span className="text-slate-400">{med.sideEffects}</span></p>
                          <div className="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-amber-300/90 mt-2">
                            <strong>Prüfungswissen:</strong> {med.pearls}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB: AUFWACHRAUM (PACU) */}
              {activeTab === 'pacu' && (
                <div className="space-y-8">
                  {/* Prozess & Ablauf */}
                  <div className="space-y-4">
                    <h3 className="text-lg font-bold text-teal-300 border-b border-slate-800 pb-2">
                      Standardprozess: Aufwachraum-Management & Entlassung
                    </h3>
                    <div className="grid md:grid-cols-3 gap-4">
                      {ATA_DATA.pacu.process.map((p, idx) => (
                        <div key={idx} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-3">
                          <h4 className="font-bold text-amber-400 text-sm">{p.phase}</h4>
                          <ul className="text-xs space-y-2 text-slate-300 list-disc list-inside">
                            {p.items.map((item, i) => (
                              <li key={i}>{item}</li>
                            ))}
                          </ul>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Postoperative Schmerztherapie */}
                  <div className="space-y-4 pt-4">
                    <h3 className="text-lg font-bold text-teal-300 border-b border-slate-800 pb-2">
                      Unterthema: Akute Postoperative Schmerztherapie
                    </h3>
                    <div className="grid md:grid-cols-2 gap-4">
                      {ATA_DATA.pacu.painManagement.map((pm, idx) => (
                        <div key={idx} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-2">
                          <h4 className="font-bold text-teal-300 text-sm">{pm.title}</h4>
                          <p className="text-xs text-slate-300 leading-relaxed">{pm.desc}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB: SYSTEME & LAGERUNG */}
              {activeTab === 'equipment' && (
                <div className="grid md:grid-cols-3 gap-6">
                  <div className="space-y-3">
                    <h3 className="text-xs uppercase tracking-wider font-bold text-slate-400 mb-2">Kategorien</h3>
                    {ATA_DATA.equipment.map((cat, idx) => (
                      <button
                        key={cat.id}
                        onClick={() => setSelectedEquipCategory(idx)}
                        className={`w-full text-left p-4 rounded-xl border transition flex items-center gap-3 ${selectedEquipCategory === idx ? 'bg-slate-850 border-teal-500/50 text-white shadow-md' : 'bg-slate-900 border-slate-800 text-slate-400 hover:bg-slate-850'}`}
                      >
                        <span className="text-2xl">{cat.icon}</span>
                        <span className="font-semibold text-sm">{cat.title}</span>
                      </button>
                    ))}
                  </div>

                  <div className="md:col-span-2 space-y-4">
                    <h3 className="text-xs uppercase tracking-wider font-bold text-slate-400 mb-2">
                      {ATA_DATA.equipment[selectedEquipCategory]?.title}
                    </h3>
                    <div className="grid gap-4">
                      {ATA_DATA.equipment[selectedEquipCategory]?.items.map((item, idx) => (
                        <div key={idx} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl hover:border-slate-700 transition space-y-2">
                          <h4 className="text-lg font-bold text-teal-300">{item.name}</h4>
                          <p className="text-slate-300 text-sm">{item.desc}</p>
                          <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs text-slate-400">
                            <strong className="text-teal-400">Klinische Besonderheit: </strong>{item.details}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB: DIALOGE & BEGRIFFE */}
              {activeTab === 'dialogues' && (
                <div className="grid md:grid-cols-2 gap-6">
                  <div className="space-y-4">
                    <h3 className="text-xs uppercase tracking-wider font-bold text-slate-400">Fachkommunikation</h3>
                    {ATA_DATA.dialogues.map((d, idx) => (
                      <div key={idx} className="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-1">
                        <p className="text-teal-300 font-semibold text-sm">"{d.de}"</p>
                        <p className="text-slate-400 text-xs italic">{d.tr}</p>
                      </div>
                    ))}
                  </div>
                  <div className="space-y-4">
                    <h3 className="text-xs uppercase tracking-wider font-bold text-slate-400">Fachbegriffe</h3>
                    <div className="grid gap-2">
                      {ATA_DATA.vocab.map((v, idx) => (
                        <div key={idx} className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center text-xs">
                          <span className="font-bold text-teal-300">{v.de}</span>
                          <span className="text-slate-400">{v.tr}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB: AI FALL-SIMULATOR */}
              {activeTab === 'ai' && (
                <div className="grid md:grid-cols-3 gap-6">
                  <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
                    <h3 className="text-lg font-bold text-teal-300">KP Prüfungsfall-Generator</h3>
                    <p className="text-xs text-slate-400">Generieren Sie komplexe Fallbeispiele für die mündliche Kenntnisprüfung.</p>
                    <button
                      onClick={generateAICase}
                      disabled={loading}
                      className="w-full bg-gradient-to-r from-teal-500 to-cyan-500 hover:opacity-90 text-slate-950 font-extrabold py-3.5 rounded-xl transition shadow-lg shadow-teal-500/20 disabled:opacity-50"
                    >
                      {loading ? 'Generiere Fall...' : 'Neuen Fall erstellen ✨'}
                    </button>
                  </div>

                  <div className="md:col-span-2 bg-slate-900 p-6 rounded-2xl border border-slate-800 min-h-[450px]">
                    <h3 className="text-lg font-bold text-teal-300 mb-4">Szenario & Fragen</h3>
                    {loading ? (
                      <div className="text-slate-400 animate-pulse text-sm">Prüfungsfall wird geladen...</div>
                    ) : aiResponse ? (
                      <div className="whitespace-pre-line text-slate-200 text-sm leading-relaxed bg-slate-950 p-5 rounded-xl border border-slate-800 font-mono">
                        {aiResponse}
                      </div>
                    ) : (
                      <div className="text-slate-500 text-sm">
                        Klicken Sie auf "Neuen Fall erstellen", um zu starten.
                      </div>
                    )}
                  </div>
                </div>
              )}

            </main>

            {/* Footer */}
            <footer className="border-t border-slate-800 bg-slate-950 p-4 text-center text-xs text-slate-500">
              ATA KENNTNISPRÜFUNG • Anästhesietechnischer Assistent Preparation Platform
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
