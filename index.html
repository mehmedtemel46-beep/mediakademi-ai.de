<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATA KENNTNISPRÜFUNG - Intensiv-Testtrainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-black text-white min-h-screen font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      // 10 ALLGEMEINE ATA FRAGEN (Mit B1-B2 Fachsprache, Vorerkrankungen COPD/Diabetes/KHK & Geräten)
      const DEFAULT_GENERAL_QUESTIONS = [
        {
          question: "Ein 68-jähriger Patient mit COPD und KHK soll operiert werden. Wie hoch sollte der Cuffdruck des Endotrachealtubus eingestellt werden?",
          svgType: "ett",
          options: [
            "10 - 15 cmH2O",
            "20 - 30 cmH2O",
            "35 - 45 cmH2O",
            "50 - 60 cmH2O",
            "70 - 80 cmH2O"
          ],
          answer: 1,
          explanation: "Richtig ist 20-30 cmH2O. Ein Druck unter 20 cmH2O erhöht das Risiko für Aspiration. Ein Druck über 30 cmH2O schädigt die Schleimhaut der Trachea."
        },
        {
          question: "Welches Medikament ist das spezifische Antidot für Rocuronium?",
          svgType: "meds",
          options: [
            "Naloxon",
            "Flumazenil",
            "Atropin",
            "Sugammadex (Bridion)",
            "Neostigmin"
          ],
          answer: 3,
          explanation: "Richtig ist Sugammadex. Es bindet Rocuronium im Blut. Dadurch wird die Muskelrelaxierung sehr schnell aufgehoben."
        },
        {
          question: "Ein Patient mit Diabetes mellitus Typ 2 wird intubiert. Was ist der sicherste Beweis für die korrekte Lage des Tubus?",
          svgType: "capno",
          options: [
            "Sichtbare Bewegung des Brustkorbs",
            "Auskultation der Lunge",
            "Kontinuierliche Kapnografie (etCO2-Kurve)",
            "Fehlen von Geräuschen im Magen",
            "Beschlagen des Tubus"
          ],
          answer: 2,
          explanation: "Richtig ist die kontinuierliche Kapnografie. Nur eine sichere etCO2-Kurve bestätigt, dass der Tubus genau in der Trachea liegt."
        },
        {
          question: "Welche Dosierung von Rocuronium wird bei einer Blitzeinleitung (RSI) empfohlen?",
          svgType: "meds",
          options: [
            "0,1 mg/kg kgKG",
            "0,3 mg/kg kgKG",
            "0,6 mg/kg kgKG",
            "1,2 mg/kg kgKG",
            "2,0 mg/kg kgKG"
          ],
          answer: 3,
          explanation: "Richtig ist 1,2 mg/kg kgKG. Bei der RSI nutzt man die doppelte Dosis, damit der Patient nach ca. 60 Sekunden entspannt ist."
        },
        {
          question: "Welche Kombination von Medikamenten löst eine Maligne Hyperthermie (MH) aus?",
          svgType: "vapor",
          options: [
            "Propofol und Fentanyl",
            "Volatile Anästhetika (z. B. Sevofluran) und Succinylcholin",
            "Midazolam und Remifentanil",
            "Rocuronium und Sugammadex",
            "Ketamin und Atropin"
          ],
          answer: 1,
          explanation: "Richtig sind Narkosegase (z. B. Sevofluran) und Succinylcholin. Sie führen bei genetischer Veranlagung zu einer gefährlichen Stoffwechselkrise."
        },
        {
          question: "Ein Patient mit bekannter KHK zeigt im EKG ST-Strecken-Senkungen. Was bedeutet das?",
          svgType: "ecg",
          options: [
            "Myokardiale Ischämie (Sauerstoffmangel am Herzen)",
            "Maligne Hyperthermie",
            "Hyperkaliämie",
            "Laryngospasmus",
            "Anaphylaxie Grad I"
          ],
          answer: 0,
          explanation: "Richtig ist myokardiale Ischämie. ST-Senkungen zeigen, dass der Herzmuskel zu wenig Sauerstoff bekommt. Das ist bei KHK gefährlich."
        },
        {
          question: "Welches Notfallmedikament muss bei einer Malignen Hyperthermie sofort gegeben werden?",
          svgType: "meds",
          options: [
            "Dantrolen",
            "Noradrenalin",
            "Prednisolon",
            "Atropin",
            "Amiodaron"
          ],
          answer: 0,
          explanation: "Richtig ist Dantrolen. Es stoppt die unkontrollierte Calciumfreisetzung in der Muskelzelle und rettet das Leben des Patienten."
        },
        {
          question: "Wie hoch ist das Ziel-Zugvolumen (Vt) bei der lungenprotektiven Beatmung eines COPD-Patienten?",
          svgType: "ventilator",
          options: [
            "12 - 15 ml/kg tatsächliches Gewicht",
            "6 - 8 ml/kg ideales Körpergewicht (IBW)",
            "15 - 20 ml/kg ideales Körpergewicht",
            "Pauschal immer 800 ml",
            "2 - 4 ml/kg tatsächliches Gewicht"
          ],
          answer: 1,
          explanation: "Richtig ist 6-8 ml/kg des idealen Körpergewichts. Das schützt die Lunge vor Barotrauma und Volutrauma."
        },
        {
          question: "Welcher TOF-Wert (Train-of-Four) zeigt eine sichere Erholung der Muskelkraft vor der Extubation an?",
          svgType: "tof",
          options: [
            "TOF-Ratio > 0,25 (25 %)",
            "TOF-Ratio > 0,50 (50 %)",
            "TOF-Ratio > 0,75 (75 %)",
            "TOF-Ratio > 0,90 (90 %)",
            "TOF-Count 1/4"
          ],
          answer: 3,
          explanation: "Richtig ist TOF-Ratio > 0,90 (90 %). Erst ab diesem Wert sind die Schutzreflexe und die Atemmuskulatur wieder stark genug."
        },
        {
          question: "Welcher Venenzugang hat nach ISO-Standard die Farbe Grün?",
          svgType: "pvk",
          options: [
            "22 Gauge (Blau)",
            "20 Gauge (Rosa)",
            "18 Gauge (Grün)",
            "16 Gauge (Weiß)",
            "14 Gauge (Orange)"
          ],
          answer: 2,
          explanation: "Richtig ist 18 Gauge (Grün). Diese Größe erlaubt eine schnelle Infusion von Flüssigkeiten im Notfall."
        }
      ];

      // 10 FALLBASIERTE ATA FRAGEN (CASE-BASED, B1-B2 DEUTSCH)
      const DEFAULT_CASE_QUESTIONS = [
        {
          patientInfo: "PATIENTENFALL: 65-jähriger Patient mit COPD und Diabetes mellitus Typ 2. Notfall-OP wegen Ileus. Der Patient ist nicht nüchtern.",
          question: "Welches Anästhesieverfahren wählen Sie für die Narkoseeinleitung?",
          svgType: "ett",
          options: [
            "Standard-Einleitung mit Maskenbeatmung",
            "Rapid Sequence Induction (RSI) ohne Zwischenbeatmung",
            "TIVA mit Larynxmaske",
            "Spinalanästhesie im Sitzen",
            "Plexusanästhesie"
          ],
          answer: 1,
          explanation: "Richtig ist die RSI ohne Zwischenbeatmung. Da der Patient nicht nüchtern ist, verhindert dieses Verfahren eine Aspiration von Mageninhalt."
        },
        {
          patientInfo: "PATIENTENFALL: 58-jähriger Patient mit KHK. Während der OP steigt der etCO2-Wert von 35 auf 68 mmHg. Die Herzfrequenz steigt auf 135/min. Die Temperatur steigt schnell an.",
          question: "Welche Komplikation liegt vor und was tun Sie zuerst?",
          svgType: "vapor",
          options: [
            "Anaphylaxie; Adrenalin geben",
            "Maligne Hyperthermie; Narkosegase stoppen, 100% O2 geben, Dantrolen aufziehen",
            "CO2-Embolie; Patient flach lagern",
            "Opioid-Überdosierung; Naloxon geben",
            "Pneumothorax; Entlastungspunktion"
          ],
          answer: 1,
          explanation: "Richtig ist Maligne Hyperthermie. Bei hohem etCO2, Tachykardie und Fieber müssen Narkosegase sofort gestoppt und Dantrolen gegeben werden."
        },
        {
          patientInfo: "PATIENTENFALL: 70-jähriger Patient im Aufwachraum nach Bauch-OP. Er hat Diabetes und KHK. Er ist sehr müde. Atemfrequenz: 7/min. SpO2: 87 %.",
          question: "Was ist die Ursache und was ist die beste erste Maßnahme?",
          svgType: "capno",
          options: [
            "Restrelaxierung; Sugammadex geben",
            "Opioid-Überhang; Patient ansprechen, O2 geben, evtl. Naloxon vorsichtig dosieren",
            "Lungenembolie; Lysis starten",
            "Volumenmangel; 2000 ml Ringer-Laktat geben",
            "Hypoglykämie; sofort 40% Glukose spritzen"
          ],
          answer: 1,
          explanation: "Richtig ist Opioid-Überhang. Eine niedrige Atemfrequenz (7/min) nach OP deutet auf Schmerzmittelwirkung hin. Zuerst O2 geben und den Patienten zum Atmen auffordern."
        },
        {
          patientInfo: "PATIENTENFALL: 52-jährige Patientin mit Diabetes. Nach Injektion von Propofol fällt der Blutdruck von 130/80 auf 82/48 mmHg.",
          question: "Welche Ursache liegt vor und welches Medikament hilft als Bolus?",
          svgType: "meds",
          options: [
            "Anaphylaktischer Schock; Adrenalin",
            "Myokardinfarkt; Heparin",
            "Propofol-Vasodilatation; Akrinor-Bolus geben",
            "Volumenmangel; Erythrozytenkonzentrat",
            "Sepsis; Antibiotikum"
          ],
          answer: 2,
          explanation: "Richtig ist Propofol-Vasodilatation. Propofol weitet die Gefäße. Ein Bolus Akrinor (oder Noradrenalin) stellt den Blutdruck schnell wieder her."
        },
        {
          patientInfo: "PATIENTENFALL: 62-jähriger Patient mit schwerer COPD. Bei der Laryngoskopie sieht der ATA nur die Epiglottis (Cormack-Lehane III).",
          question: "Welches Gerät hilft in dieser Situation am besten?",
          svgType: "vlaryngo",
          options: [
            "Guedel-Tubus",
            "Videolaryngoskop oder Führungsstab (Bougie)",
            "Larynxmaske 1. Generation",
            "Wendel-Tubus",
            "Koniotomie-Set"
          ],
          answer: 1,
          explanation: "Richtig ist das Videolaryngoskop oder ein Bougie. Damit kann man die Stimmbandebene trotz erschwertem Atemweg besser sehen und intubieren."
        }
      ];

      // SCHEME SVG ICON COMPONENT
      const TechnicalEquipmentSVG = ({ type }) => {
        switch (type) {
          case 'ett':
            return (
              <svg className="w-24 h-24 text-teal-400 mx-auto mb-2" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="3">
                <path d="M20,20 C40,20 70,30 80,80" />
                <ellipse cx="75" cy="70" rx="8" ry="5" fill="#14b8a6" fillOpacity="0.4" />
                <line x1="20" y1="20" x2="15" y2="15" strokeWidth="5" />
                <text x="30" y="40" fill="#22d3ee" fontSize="8" strokeWidth="0">Tubus (ETT)</text>
              </svg>
            );
          case 'vlaryngo':
            return (
              <svg className="w-24 h-24 text-cyan-400 mx-auto mb-2" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="3">
                <path d="M30,80 L30,40 L70,30" />
                <circle cx="70" cy="30" r="4" fill="#f59e0b" />
                <rect x="20" y="70" width="20" height="20" rx="3" fill="#0e7490" />
                <text x="35" y="60" fill="#22d3ee" fontSize="8" strokeWidth="0">Videolaryngoskop</text>
              </svg>
            );
          case 'vapor':
            return (
              <svg className="w-24 h-24 text-amber-400 mx-auto mb-2" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="3">
                <rect x="30" y="30" width="40" height="50" rx="5" fill="#1e293b" />
                <circle cx="50" cy="50" r="12" fill="#f59e0b" fillOpacity="0.3" />
                <line x1="50" y1="30" x2="50" y2="20" />
                <text x="32" y="75" fill="#f59e0b" fontSize="8" strokeWidth="0">Verdampfer</text>
              </svg>
            );
          case 'capno':
            return (
              <svg className="w-24 h-24 text-teal-300 mx-auto mb-2" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="3">
                <rect x="10" y="20" width="80" height="60" rx="5" fill="#0f172a" />
                <path d="M20,60 L35,60 L40,35 L55,35 L60,60 L80,60" stroke="#10b981" strokeWidth="3" fill="none" />
                <text x="20" y="30" fill="#10b981" fontSize="8" strokeWidth="0">etCO2 Kapnografie</text>
              </svg>
            );
          case 'meds':
            return (
              <svg className="w-24 h-24 text-rose-400 mx-auto mb-2" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="3">
                <rect x="40" y="20" width="20" height="50" rx="2" fill="#be123c" fillOpacity="0.4" />
                <line x1="50" y1="70" x2="50" y2="85" strokeWidth="4" />
                <line x1="35" y1="20" x2="65" y2="20" strokeWidth="4" />
                <text x="25" y="95" fill="#f43f5e" fontSize="8" strokeWidth="0">Spritze / Perfusor</text>
              </svg>
            );
          case 'ecg':
            return (
              <svg className="w-24 h-24 text-emerald-400 mx-auto mb-2" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="3">
                <rect x="10" y="20" width="80" height="60" rx="5" fill="#020617" />
                <path d="M15,50 L30,50 L35,30 L40,70 L45,40 L50,55 L55,50 L85,50" stroke="#10b981" strokeWidth="3" fill="none" />
                <text x="20" y="35" fill="#10b981" fontSize="8" strokeWidth="0">EKG Monitor</text>
              </svg>
            );
          case 'ventilator':
            return (
              <svg className="w-24 h-24 text-cyan-300 mx-auto mb-2" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="3">
                <rect x="25" y="15" width="50" height="70" rx="4" fill="#0f172a" />
                <line x1="35" y1="35" x2="65" y2="35" stroke="#06b6d4" />
                <line x1="35" y1="50" x2="65" y2="50" stroke="#06b6d4" />
                <circle cx="50" cy="68" r="6" fill="#06b6d4" />
                <text x="28" y="28" fill="#06b6d4" fontSize="7" strokeWidth="0">Beatmungsgerät</text>
              </svg>
            );
          case 'tof':
            return (
              <svg className="w-24 h-24 text-amber-300 mx-auto mb-2" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="3">
                <rect x="20" y="30" width="60" height="40" rx="4" fill="#1e293b" />
                <line x1="30" y1="45" x2="30" y2="55" stroke="#f59e0b" strokeWidth="4" />
                <line x1="43" y1="45" x2="43" y2="55" stroke="#f59e0b" strokeWidth="4" />
                <line x1="56" y1="45" x2="56" y2="55" stroke="#f59e0b" strokeWidth="4" />
                <line x1="69" y1="45" x2="69" y2="55" stroke="#f59e0b" strokeWidth="4" />
                <text x="25" y="22" fill="#f59e0b" fontSize="8" strokeWidth="0">TOF Stimulator</text>
              </svg>
            );
          case 'pvk':
            return (
              <svg className="w-24 h-24 text-emerald-500 mx-auto mb-2" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="3">
                <line x1="10" y1="50" x2="70" y2="50" stroke="#10b981" strokeWidth="6" />
                <polygon points="70,45 85,50 70,55" fill="#10b981" />
                <rect x="30" y="40" width="15" height="20" fill="#10b981" />
                <text x="20" y="30" fill="#10b981" fontSize="8" strokeWidth="0">PVK Grün (18G)</text>
              </svg>
            );
          default:
            return (
              <svg className="w-24 h-24 text-teal-400 mx-auto mb-2" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="3">

              </svg>

      };

      function App() {
        const [activeMode, setActiveMode] = useState('general');
        const [questionsList, setQuestionsList] = useState(DEFAULT_GENERAL_QUESTIONS);
        const [currentQ, setCurrentQ] = useState(0);
        const [selectedOption, setSelectedOption] = useState(null);
        const [score, setScore] = useState(0);
        const [showExplanation, setShowExplanation] = useState(false);
        const [quizFinished, setQuizFinished] = useState(false);
        const [aiGeneratingQuestions, setAiGeneratingQuestions] = useState(false);

        // AI State
        const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
        const [isApiKeySaved, setIsApiKeySaved] = useState(!!localStorage.getItem('gemini_api_key'));

        const handleSaveApiKey = () => {
          localStorage.setItem('gemini_api_key', apiKey);
          setIsApiKeySaved(true);
        };

        const switchMode = (mode) => {
          setActiveMode(mode);
          if (mode === 'general') {
            setQuestionsList(DEFAULT_GENERAL_QUESTIONS);
          } else {
            setQuestionsList(DEFAULT_CASE_QUESTIONS);
          }
          resetQuiz();
        };

        const generate10QuestionsWithAI = async () => {
          if (!apiKey) {
            alert("Bitte geben Sie oben Ihren Gemini API-Schlüssel ein!");
            return;
          }
          setAiGeneratingQuestions(true);

          const isCaseMode = activeMode === 'case';
          const prompt = isCaseMode
            ? `Erstelle genau 10 fallbasierte Multiple-Choice-Fragen auf Deutsch (Sprachniveau B1-B2) für die Anästhesietechnische Assistent (ATA) Kenntnisprüfung (KP) in Deutschland.
               Berücksichtige Patientenvorerweiterungen wie COPD, Diabetes mellitus Typ 2 und KHK sowie Anästhesiegeräte (Verdampfer, ETT, Videolaryngoskop, Beatmung, Kapnografie, TOF).
               Jede Frage MUSS ein Objekt mit "patientInfo" (kurzer Fall mit Erkrankungen), "question" (einfache B1-B2 Frage), "svgType" (eines aus: "ett", "vlaryngo", "vapor", "capno", "meds", "ecg", "ventilator", "tof", "pvk"), "options" (genau 5 Optionen A-E), "answer" (Index 0-4) und "explanation" (Erklärung warum richtig) sein.
               Antworte STRENG als JSON-Array von 10 Objekten ohne Codeblock-Tags.`
            : `Erstelle genau 10 allgemeine Multiple-Choice-Fragen auf Deutsch (Sprachniveau B1-B2) für die Anästhesietechnische Assistent (ATA) Kenntnisprüfung (KP) in Deutschland.
               Integiere Vorerkrankungen (COPD, Diabetes, KHK), Anästhesiegeräte, Notfälle und Medikamente.
               Jede Frage MUSS ein Objekt mit "question" (Frage in leichtem B1-B2 Deutsch), "svgType" (eines aus: "ett", "vlaryngo", "vapor", "capno", "meds", "ecg", "ventilator", "tof", "pvk"), "options" (genau 5 Optionen A-E), "answer" (Index 0-4) und "explanation" (Erklärung warum genau diese Antwort richtig ist) sein.
               Antworte STRENG als JSON-Array von 10 Objekten ohne Codeblock-Tags.`;

          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            
            const data = await res.json();
            if (!res.ok || data.error) {
              throw new Error(data.error?.message || "Fehler bei der API-Anfrage.");
            }

            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) {
              throw new Error("Keine gültigen Daten von der KI erhalten.");
            }

            const cleanJson = text.replace(/```json|```/g, '').trim();
            const newQuestions = JSON.parse(cleanJson);

            if (Array.isArray(newQuestions) && newQuestions.length > 0) {
              setQuestionsList(newQuestions);
              resetQuiz();
            }
          } catch (err) {
            alert("Fehler bei der KI-Generierung: " + err.message);
          } finally {
            setAiGeneratingQuestions(false);
          }
        };

        const handleOptionClick = (index) => {
          if (selectedOption !== null) return;
          setSelectedOption(index);
          setShowExplanation(true);
          if (index === questionsList[currentQ].answer) {
            setScore(score + 1);
          }
        };

        const handleNextQuestion = () => {
          setSelectedOption(null);
          setShowExplanation(false);
          if (currentQ + 1 < questionsList.length) {
            setCurrentQ(currentQ + 1);
          } else {
            setQuizFinished(true);
          }
        };

        const resetQuiz = () => {
          setCurrentQ(0);
          setSelectedOption(null);
          setScore(0);
          setShowExplanation(false);
          setQuizFinished(false);
        };

        const autoNextBatch = () => {
          if (apiKey) {
            generate10QuestionsWithAI();
          } else {
            resetQuiz();
          }
        };

        const optionLabels = ["A", "B", "C", "D", "E"];

        return (
          <div className="min-h-screen flex flex-col bg-black text-white font-sans">
            {/* Header */}
            <header className="border-b border-zinc-800 bg-black sticky top-0 z-50 px-4 sm:px-6 py-4">
              <div className="max-w-7xl mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
                <div className="flex items-center gap-3">
                  <span className="text-4xl sm:text-5xl">🫁</span>
                  <div>
                    <h1 className="text-2xl sm:text-3xl lg:text-4xl font-black text-teal-400 tracking-wide">
                      ATA KENNTNISPRÜFUNG
                    </h1>
                  </div>
                </div>

                {/* API Key Box */}
                <div className="flex items-center gap-2 sm:gap-3 bg-zinc-900 p-2 rounded-2xl border border-zinc-800 w-full lg:w-auto justify-between lg:justify-start">
                  <input 
                    type="password" 
                    placeholder="Gemini API Key" 
                    value={apiKey} 
                    onChange={(e) => setApiKey(e.target.value)}
                    className="bg-black text-white px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl border border-zinc-700 text-xs sm:text-sm focus:outline-none focus:border-teal-400 flex-1 lg:w-60"
                  />
                  <button 
                    onClick={handleSaveApiKey}
                    className="bg-teal-500 hover:bg-teal-400 text-black font-extrabold px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl text-xs sm:text-sm transition shrink-0"
                  >
                    {isApiKeySaved ? 'Gespeichert ✓' : 'Speichern'}
                  </button>
                </div>
              </div>
            </header>

            {/* Test Modus Auswahl */}
            <div className="bg-black border-b border-zinc-800 px-4 sm:px-6 py-3 sm:py-4">
              <div className="max-w-7xl mx-auto flex flex-col sm:flex-row gap-3 sm:gap-4 justify-center">
                <button
                  onClick={() => switchMode('general')}
                  className={`px-4 py-3 sm:px-6 sm:py-4 rounded-2xl text-base sm:text-xl font-extrabold transition flex items-center justify-center gap-2 sm:gap-3 border-2 ${
                    activeMode === 'general'
                      ? 'bg-amber-500/20 border-amber-400 text-amber-300'
                      : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-white'
                  }`}
                >
                  📝 1. Allgemeiner Prüfungstest (10 Fragen)
                </button>
                <button
                  onClick={() => switchMode('case')}
                  className={`px-4 py-3 sm:px-6 sm:py-4 rounded-2xl text-base sm:text-xl font-extrabold transition flex items-center justify-center gap-2 sm:gap-3 border-2 ${
                    activeMode === 'case'
                      ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300'
                      : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-white'
                  }`}
                >
                  🏥 2. Fallbasierter Prüfungstest (10 Fragen)
                </button>
              </div>
            </div>

            {/* Main Content Area */}
            <main className="max-w-4xl mx-auto p-4 sm:p-6 flex-1 w-full space-y-4 sm:space-y-6">
              
              {/* KI-Generierung Bar */}
              <div className="bg-zinc-900 border border-zinc-800 p-4 sm:p-5 rounded-3xl flex flex-col sm:flex-row justify-between items-center gap-3 sm:gap-4">
                <div>
                  <h3 className="text-base sm:text-xl font-bold text-teal-300">Unendlicher KI-Prüfungsmodus (10 Fragen)</h3>
                  <p className="text-xs sm:text-sm text-zinc-400">Generieren Sie per Knopfdruck 10 neue Fragen mit B1-B2 Deutsch.</p>
                </div>
                <button
                  onClick={generate10QuestionsWithAI}
                  disabled={aiGeneratingQuestions}
                  className="bg-gradient-to-r from-amber-400 to-teal-400 hover:opacity-90 text-black text-xs sm:text-base font-black px-4 py-2.5 sm:px-6 sm:py-3.5 rounded-2xl transition shadow-lg shadow-teal-500/20 disabled:opacity-50 whitespace-nowrap w-full sm:w-auto"
                >
                  {aiGeneratingQuestions ? 'Generiere 10 Fragen...' : '✨ 10 Neue KI-Fragen Laden'}
                </button>
              </div>

              {!quizFinished ? (
                <div className="bg-zinc-950 border-2 border-zinc-800 p-4 sm:p-8 rounded-3xl space-y-6 sm:space-y-8 relative shadow-2xl">
                  
                  {/* Fortschrittsbalken */}
                  <div className="space-y-2">
                    <div className="flex justify-between items-center text-sm sm:text-lg font-bold">
                      <span className="text-teal-400 font-mono">
                        Frage {currentQ + 1} von {questionsList.length}
                      </span>
                      <span className="bg-black px-3 py-1 sm:px-4 sm:py-1.5 rounded-full border border-zinc-800 text-amber-300 font-mono text-xs sm:text-base">
                        Score: {score}
                      </span>
                    </div>
                    <div className="w-full bg-black h-2.5 sm:h-3 rounded-full overflow-hidden border border-zinc-800">
                      <div 
                        className="bg-gradient-to-r from-teal-400 via-cyan-400 to-amber-400 h-full transition-all duration-300"
                        style={{ width: `${((currentQ + 1) / questionsList.length) * 100}%` }}
                      ></div>
                    </div>
                  </div>

                  {/* Geräte- und Schemabild */}
                  <div className="bg-black p-4 rounded-2xl border border-zinc-800 text-center">
                    <TechnicalEquipmentSVG type={questionsList[currentQ]?.svgType} />
                  </div>

                  {/* Fallbeispiel Anzeige */}
                  {questionsList[currentQ]?.patientInfo && (
                    <div className="bg-black p-4 sm:p-6 rounded-2xl border-l-4 sm:border-l-8 border-l-cyan-400 border border-zinc-800 space-y-1 sm:space-y-2">
                      <span className="text-xs sm:text-sm font-black text-cyan-400 uppercase tracking-widest block">Klinischer Patientenfall</span>
                      <p className="text-base sm:text-xl text-zinc-200 leading-relaxed font-medium">
                        {questionsList[currentQ].patientInfo}
                      </p>
                    </div>
                  )}

                  {/* Fragetext */}
                  <h2 className="text-base sm:text-xl lg:text-2xl font-extrabold text-amber-300 leading-snug">
                    {questionsList[currentQ]?.question}
                  </h2>

                  {/* 5 Antwort-Optionen (A, B, C, D, E) */}
                  <div className="grid gap-3 sm:gap-4">
                    {questionsList[currentQ]?.options.map((opt, idx) => {
                      let btnStyle = "bg-zinc-900 border-zinc-800 text-zinc-100 hover:border-teal-400 hover:bg-zinc-800";
                      
                      if (selectedOption !== null) {
                        if (idx === questionsList[currentQ].answer) {
                          btnStyle = "bg-emerald-950 border-2 border-emerald-400 text-emerald-100 font-extrabold shadow-lg shadow-emerald-500/20";
                        } else if (idx === selectedOption) {
                          btnStyle = "bg-rose-950 border-2 border-rose-500 text-rose-200 font-extrabold";
                        } else {
                          btnStyle = "bg-black border-zinc-900 text-zinc-600 opacity-30";
                        }
                      }

                      return (
                        <button
                          key={idx}
                          onClick={() => handleOptionClick(idx)}
                          disabled={selectedOption !== null}
                          className={`w-full text-left p-3 sm:p-4 rounded-2xl border-2 transition-all duration-150 text-xs sm:text-base lg:text-lg flex items-center gap-3 sm:gap-4 ${btnStyle}`}
                        >
                          <span className="w-7 h-7 sm:w-9 sm:h-9 rounded-xl bg-black border border-zinc-700 flex items-center justify-center font-mono font-black text-xs sm:text-base text-amber-400 shrink-0">
                            {optionLabels[idx]}
                          </span>
                          <span className="flex-1 leading-relaxed">{opt}</span>
                          {selectedOption !== null && idx === questionsList[currentQ].answer && (
                            <span className="text-emerald-400 font-black text-lg sm:text-xl">✓</span>
                          )}
                        </button>
                      );
                    })}
                  </div>

                  {/* Erklärung / Warum diese Antwort? */}
                  {showExplanation && (
                    <div className="space-y-4 sm:space-y-6 pt-4 sm:pt-6 border-t border-zinc-800">
                      <div className="bg-black p-4 sm:p-6 rounded-2xl border border-teal-500/40 text-xs sm:text-base text-zinc-200 space-y-1 sm:space-y-2">
                        <strong className="text-teal-400 text-sm sm:text-lg block">Warum ist diese Antwort richtig?</strong>
                        <p className="leading-relaxed">{questionsList[currentQ].explanation}</p>
                      </div>
                      <button
                        onClick={handleNextQuestion}
                        className="w-full bg-gradient-to-r from-teal-400 to-cyan-400 hover:opacity-90 text-black font-black py-3 sm:py-4 rounded-2xl text-base sm:text-xl transition shadow-xl shadow-teal-500/20"
                      >
                        {currentQ + 1 < questionsList.length ? 'Nächste Frage →' : 'Statistik Anzeigen (10 Fragen beendet) 🏆'}
                      </button>
                    </div>
                  )}

                </div>
              ) : (
                /* Ausführliche Statistik nach 10 Fragen */
                <div className="bg-zinc-950 border-2 border-zinc-800 p-6 sm:p-12 rounded-3xl text-center space-y-6 sm:space-y-8 shadow-2xl">
                  <span className="text-6xl sm:text-8xl">🏆</span>
                  <h2 className="text-2xl sm:text-4xl font-black text-teal-300">10 Fragen Beendet!</h2>
                  
                  <div className="grid sm:grid-cols-3 gap-4 sm:gap-6 max-w-3xl mx-auto">
                    <div className="bg-black p-4 sm:p-6 rounded-2xl border border-zinc-800 space-y-1 sm:space-y-2">
                      <p className="text-xs sm:text-sm text-zinc-400 font-bold uppercase tracking-wider">Erreichte Punkte</p>
                      <p className="text-3xl sm:text-5xl font-black text-amber-400 font-mono">{score} / {questionsList.length}</p>
                    </div>
                    <div className="bg-black p-4 sm:p-6 rounded-2xl border border-zinc-800 space-y-1 sm:space-y-2">
                      <p className="text-xs sm:text-sm text-zinc-400 font-bold uppercase tracking-wider">Erfolgsquote</p>
                      <p className="text-3xl sm:text-5xl font-black text-cyan-400 font-mono">
                        {Math.round((score / questionsList.length) * 100)} %
                      </p>
                    </div>
                    <div className="bg-black p-4 sm:p-6 rounded-2xl border border-zinc-800 space-y-1 sm:space-y-2">
                      <p className="text-xs sm:text-sm text-zinc-400 font-bold uppercase tracking-wider">Ergebnis</p>
                      <p className="text-xl sm:text-3xl font-black text-emerald-400 font-mono pt-1 sm:pt-2">
                        {(score / questionsList.length) >= 0.75 ? "BESTANDEN ✓" : "NICHT BESTANDEN ✗"}
                      </p>
                    </div>
                  </div>

                  <div className="flex flex-col sm:flex-row justify-center gap-3 sm:gap-4 pt-2 sm:pt-4">
                    <button
                      onClick={resetQuiz}
                      className="bg-zinc-900 hover:bg-zinc-800 text-zinc-100 text-sm sm:text-lg font-bold px-6 py-3.5 sm:px-8 sm:py-4 rounded-2xl transition border border-zinc-700"
                    >
                      Diesen Test Wiederholen 🔄
                    </button>
                    <button
                      onClick={autoNextBatch}
                      className="bg-gradient-to-r from-teal-400 to-amber-400 text-black text-sm sm:text-lg font-black px-6 py-3.5 sm:px-8 sm:py-4 rounded-2xl transition shadow-lg shadow-teal-500/20"
                    >
                      ✨ Automatisch Nächste 10 Fragen Starten
                    </button>
                  </div>
                </div>
              )}

            </main>

            {/* Footer */}
            <footer className="border-t border-zinc-800 bg-black p-4 sm:p-6 text-center text-xs sm:text-sm text-zinc-500 font-medium">
              ATA KENNTNISPRÜFUNG • Mehmet Temel
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
