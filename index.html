      function App() {
        const [activeMode, setActiveMode] = useState('general');
        const [questionsList, setQuestionsList] = useState(DEFAULT_GENERAL_QUESTIONS);
        const [currentQ, setCurrentQ] = useState(0);
        const [selectedOption, setSelectedOption] = useState(null);
        const [score, setScore] = useState(0);
        const [showExplanation, setShowExplanation] = useState(false);
        const [quizFinished, setQuizFinished] = useState(false);
        const [aiGeneratingQuestions, setAiGeneratingQuestions] = useState(false);

        // AI State
        const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
        const [isApiKeySaved, setIsApiKeySaved] = useState(!!localStorage.getItem('gemini_api_key'));

        const handleSaveApiKey = () => {
          localStorage.setItem('gemini_api_key', apiKey.trim());
          setIsApiKeySaved(true);
        };

        const switchMode = (mode) => {
          setActiveMode(mode);
          if (mode === 'general') {
            setQuestionsList(DEFAULT_GENERAL_QUESTIONS);
          } else {
            setQuestionsList(DEFAULT_CASE_QUESTIONS);
          }
          resetQuiz();
        };

        const generate10QuestionsWithAI = async () => {
          if (!apiKey || apiKey.trim() === '') {
            alert("Bitte geben Sie oben Ihren Gemini API-Schlüssel ein!");
            return;
          }
          setAiGeneratingQuestions(true);

          const cleanApiKey = apiKey.trim();
          const isCaseMode = activeMode === 'case';
          const prompt = isCaseMode
            ? `Erstelle genau 10 fallbasierte Multiple-Choice-Fragen auf Deutsch (Sprachniveau B1-B2) für die Anästhesietechnische Assistent (ATA) Kenntnisprüfung (KP) in Deutschland.
               Erstelle einen ausführlichen, langen Patientenfall (3-5 Sätze) mit Anamnese, Vorerkrankungen (z.B. COPD, Diabetes mellitus Typ 2, KHK) und genauen Vitalparametern.
               Jede Frage MUSS ein Objekt mit "patientInfo" (ausführlicher Fall), "question" (Frage auf B1-B2 Deutsch), "options" (genau 5 Optionen A-E), "answer" (Index 0-4) und "explanation" (Erklärung warum richtig) sein.
               Antworte STRENG als JSON-Array von 10 Objekten ohne Codeblock-Tags.`
            : `Erstelle genau 10 allgemeine Multiple-Choice-Fragen auf Deutsch (Sprachniveau B1-B2) für die Anästhesietechnische Assistent (ATA) Kenntnisprüfung (KP) in Deutschland.
               Integiere Vorerkrankungen (COPD, Diabetes, KHK), Anästhesiegeräte, Notfälle und Pharmakologie.
               Jede Frage MUSS ein Objekt mit "question" (Frage in leichtem B1-B2 Deutsch), "options" (genau 5 Optionen A-E), "answer" (Index 0-4) und "explanation" (Erklärung warum genau diese Antwort richtig ist) sein.
               Antworte STRENG als JSON-Array von 10 Objekten ohne Codeblock-Tags.`;

          try {
            // Primärer Versuch: gemini-3.8-flash
            let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${cleanApiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            // Falls gemini-3.8-flash ausgelastet ist (High Demand / 503 / 429), automatisch auf gemini-2.5-flash ausweichen
            if (!res.ok) {
              res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanApiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
              });
            }

            const data = await res.json();
            if (!res.ok || data.error) {
              throw new Error(data.error?.message || "Fehler bei der API-Anfrage.");
            }

            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) {
              throw new Error("Keine gültigen Daten von der KI erhalten.");
            }

            const cleanJson = text.replace(/```json|```/g, '').trim();
            const newQuestions = JSON.parse(cleanJson);

            if (Array.isArray(newQuestions) && newQuestions.length > 0) {
              setQuestionsList(newQuestions);
              resetQuiz();
            }
          } catch (err) {
            alert("Fehler bei der KI-Generierung: " + err.message);
          } finally {
            setAiGeneratingQuestions(false);
          }
        };

        const handleOptionClick = (index) => {
          if (selectedOption !== null) return;
          setSelectedOption(index);
          setShowExplanation(true);
          if (index === questionsList[currentQ].answer) {
            setScore(score + 1);
          }
        };

        const handleNextQuestion = () => {
          setSelectedOption(null);
          setShowExplanation(false);
          if (currentQ + 1 < questionsList.length) {
            setCurrentQ(currentQ + 1);
          } else {
            setQuizFinished(true);
          }
        };

        const resetQuiz = () => {
          setCurrentQ(0);
          setSelectedOption(null);
          setScore(0);
          setShowExplanation(false);
          setQuizFinished(false);
        };

        const autoNextBatch = () => {
          if (apiKey) {
            generate10QuestionsWithAI();
          } else {
            resetQuiz();
          }
        };

        const optionLabels = ["A", "B", "C", "D", "E"];

        return (
          <div className="min-h-screen flex flex-col bg-black text-white font-sans">
            {/* Header */}
            <header className="border-b border-zinc-800 bg-black sticky top-0 z-50 px-4 sm:px-6 py-4">
              <div className="max-w-7xl mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
                <div className="flex items-center gap-3">
                  <span className="text-4xl sm:text-5xl">🫁</span>
                  <div>
                    <h1 className="text-2xl sm:text-3xl lg:text-4xl font-black text-teal-400 tracking-wide">
                      ATA KENNTNISPRÜFUNG
                    </h1>
                  </div>
                </div>

                {/* API Key Box */}
                <div className="flex items-center gap-2 sm:gap-3 bg-zinc-900 p-2 rounded-2xl border border-zinc-800 w-full lg:w-auto justify-between lg:justify-start">
                  <input 
                    type="password" 
                    placeholder="Gemini API Key" 
                    value={apiKey} 
                    onChange={(e) => setApiKey(e.target.value)}
                    className="bg-black text-white px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl border border-zinc-700 text-xs sm:text-sm focus:outline-none focus:border-teal-400 flex-1 lg:w-60"
                  />
                  <button 
                    onClick={handleSaveApiKey}
                    className="bg-teal-500 hover:bg-teal-400 text-black font-extrabold px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl text-xs sm:text-sm transition shrink-0"
                  >
                    {isApiKeySaved ? 'Gespeichert ✓' : 'Speichern'}
                  </button>
                </div>
              </div>
            </header>

            {/* Test Modus Auswahl */}
            <div className="bg-black border-b border-zinc-800 px-4 sm:px-6 py-3 sm:py-4">
              <div className="max-w-7xl mx-auto flex flex-col sm:flex-row gap-3 sm:gap-4 justify-center">
                <button
                  onClick={() => switchMode('general')}
                  className={`px-4 py-3 sm:px-6 sm:py-4 rounded-2xl text-base sm:text-xl font-extrabold transition flex items-center justify-center gap-2 sm:gap-3 border-2 ${
                    activeMode === 'general'
                      ? 'bg-amber-500/20 border-amber-400 text-amber-300'
                      : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-white'
                  }`}
                >
                  📝 1. Allgemeiner Prüfungstest (10 Fragen)
                </button>
                <button
                  onClick={() => switchMode('case')}
                  className={`px-4 py-3 sm:px-6 sm:py-4 rounded-2xl text-base sm:text-xl font-extrabold transition flex items-center justify-center gap-2 sm:gap-3 border-2 ${
                    activeMode === 'case'
                      ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300'
                      : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-white'
                  }`}
                >
                  🏥 2. Fallbasierter Prüfungstest (10 Fragen)
                </button>
              </div>
            </div>

            {/* Main Content Area */}
            <main className="max-w-4xl mx-auto p-4 sm:p-6 flex-1 w-full space-y-4 sm:space-y-6">
              
              {/* KI-Generierung Bar */}
              <div className="bg-zinc-900 border border-zinc-800 p-4 sm:p-5 rounded-3xl flex flex-col sm:flex-row justify-between items-center gap-3 sm:gap-4">
                <div>
                  <h3 className="text-base sm:text-xl font-bold text-teal-300">Unendlicher KI-Prüfungsmodus (10 Fragen)</h3>
                  <p className="text-xs sm:text-sm text-zinc-400">Generieren Sie per Knopfdruck 10 neue Fragen mit B1-B2 Deutsch.</p>
                </div>
                <button
                  onClick={generate10QuestionsWithAI}
                  disabled={aiGeneratingQuestions}
                  className="bg-gradient-to-r from-amber-400 to-teal-400 hover:opacity-90 text-black text-xs sm:text-base font-black px-4 py-2.5 sm:px-6 sm:py-3.5 rounded-2xl transition shadow-lg shadow-teal-500/20 disabled:opacity-50 whitespace-nowrap w-full sm:w-auto"
                >
                  {aiGeneratingQuestions ? 'Generiere 10 Fragen...' : '✨ 10 Neue KI-Fragen Laden'}
                </button>
              </div>

              {!quizFinished ? (
                <div className="bg-zinc-950 border-2 border-zinc-800 p-4 sm:p-8 rounded-3xl space-y-6 sm:space-y-8 relative shadow-2xl">
                  
                  {/* Fortschrittsbalken */}
                  <div className="space-y-2">
                    <div className="flex justify-between items-center text-sm sm:text-lg font-bold">
                      <span className="text-teal-400 font-mono">
                        Frage {currentQ + 1} von {questionsList.length}
                      </span>
                      <span className="bg-black px-3 py-1 sm:px-4 sm:py-1.5 rounded-full border border-zinc-800 text-amber-300 font-mono text-xs sm:text-base">
                        Score: {score}
                      </span>
                    </div>
                    <div className="w-full bg-black h-2.5 sm:h-3 rounded-full overflow-hidden border border-zinc-800">
                      <div 
                        className="bg-gradient-to-r from-teal-400 via-cyan-400 to-amber-400 h-full transition-all duration-300"
                        style={{ width: `${((currentQ + 1) / questionsList.length) * 100}%` }}
                      ></div>
                    </div>
                  </div>

                  {/* Ausführliches Fallbeispiel */}
                  {questionsList[currentQ]?.patientInfo && (
                    <div className="bg-black p-5 sm:p-7 rounded-2xl border-l-4 sm:border-l-8 border-l-cyan-400 border border-zinc-800 space-y-2">
                      <span className="text-xs sm:text-sm font-black text-cyan-400 uppercase tracking-widest block">Klinischer Patientenfall</span>
                      <p className="text-base sm:text-xl text-zinc-200 leading-relaxed font-medium">
                        {questionsList[currentQ].patientInfo}
                      </p>
                    </div>
                  )}

                  {/* Fragetext */}
                  <h2 className="text-base sm:text-xl lg:text-2xl font-extrabold text-amber-300 leading-snug">
                    {questionsList[currentQ]?.question}
                  </h2>

                  {/* 5 Antwort-Optionen (A, B, C, D, E) */}
                  <div className="grid gap-3 sm:gap-4">
                    {questionsList[currentQ]?.options.map((opt, idx) => {
                      let btnStyle = "bg-zinc-900 border-zinc-800 text-zinc-100 hover:border-teal-400 hover:bg-zinc-800";
                      
                      if (selectedOption !== null) {
                        if (idx === questionsList[currentQ].answer) {
                          btnStyle = "bg-emerald-950 border-2 border-emerald-400 text-emerald-100 font-extrabold shadow-lg shadow-emerald-500/20";
                        } else if (idx === selectedOption) {
                          btnStyle = "bg-rose-950 border-2 border-rose-500 text-rose-200 font-extrabold";
                        } else {
                          btnStyle = "bg-black border-zinc-900 text-zinc-600 opacity-30";
                        }
                      }

                      return (
                        <button
                          key={idx}
                          onClick={() => handleOptionClick(idx)}
                          disabled={selectedOption !== null}
                          className={`w-full text-left p-3.5 sm:p-5 rounded-2xl border-2 transition-all duration-150 text-xs sm:text-base lg:text-lg flex items-center gap-3 sm:gap-4 ${btnStyle}`}
                        >
                          <span className="w-7 h-7 sm:w-9 sm:h-9 rounded-xl bg-black border border-zinc-700 flex items-center justify-center font-mono font-black text-xs sm:text-base text-amber-400 shrink-0">
                            {optionLabels[idx]}
                          </span>
                          <span className="flex-1 leading-relaxed">{opt}</span>
                          {selectedOption !== null && idx === questionsList[currentQ].answer && (
                            <span className="text-emerald-400 font-black text-lg sm:text-xl">✓</span>
                          )}
                        </button>
                      );
                    })}
                  </div>

                  {/* Erklärung / Warum diese Antwort? */}
                  {showExplanation && (
                    <div className="space-y-4 sm:space-y-6 pt-4 sm:pt-6 border-t border-zinc-800">
                      <div className="bg-black p-4 sm:p-6 rounded-2xl border border-teal-500/40 text-xs sm:text-base text-zinc-200 space-y-1 sm:space-y-2">
                        <strong className="text-teal-400 text-sm sm:text-lg block">Warum ist diese Antwort richtig?</strong>
                        <p className="leading-relaxed">{questionsList[currentQ].explanation}</p>
                      </div>
                      <button
                        onClick={handleNextQuestion}
                        className="w-full bg-gradient-to-r from-teal-400 to-cyan-400 hover:opacity-90 text-black font-black py-3 sm:py-4 rounded-2xl text-base sm:text-xl transition shadow-xl shadow-teal-500/20"
                      >
                        {currentQ + 1 < questionsList.length ? 'Nächste Frage →' : 'Statistik Anzeigen (10 Fragen beendet) 🏆'}
                      </button>
                    </div>
                  )}

                </div>
              ) : (
                /* Ausführliche Statistik nach 10 Fragen */
                <div className="bg-zinc-950 border-2 border-zinc-800 p-6 sm:p-12 rounded-3xl text-center space-y-6 sm:space-y-8 shadow-2xl">
                  <span className="text-6xl sm:text-8xl">🏆</span>
                  <h2 className="text-2xl sm:text-4xl font-black text-teal-300">10 Fragen Beendet!</h2>
                  
                  <div className="grid sm:grid-cols-3 gap-4 sm:gap-6 max-w-3xl mx-auto">
                    <div className="bg-black p-4 sm:p-6 rounded-2xl border border-zinc-800 space-y-1 sm:space-y-2">
                      <p className="text-xs sm:text-sm text-zinc-400 font-bold uppercase tracking-wider">Erreichte Punkte</p>
                      <p className="text-3xl sm:text-5xl font-black text-amber-400 font-mono">{score} / {questionsList.length}</p>
                    </div>
                    <div className="bg-black p-4 sm:p-6 rounded-2xl border border-zinc-800 space-y-1 sm:space-y-2">
                      <p className="text-xs sm:text-sm text-zinc-400 font-bold uppercase tracking-wider">Erfolgsquote</p>
                      <p className="text-3xl sm:text-5xl font-black text-cyan-400 font-mono">
                        {Math.round((score / questionsList.length) * 100)} %
                      </p>
                    </div>
                    <div className="bg-black p-4 sm:p-6 rounded-2xl border border-zinc-800 space-y-1 sm:space-y-2">
                      <p className="text-xs sm:text-sm text-zinc-400 font-bold uppercase tracking-wider">Ergebnis</p>
                      <p className="text-xl sm:text-3xl font-black text-emerald-400 font-mono pt-1 sm:pt-2">
                        {(score / questionsList.length) >= 0.75 ? "BESTANDEN ✓" : "NICHT BESTANDEN ✗"}
                      </p>
                    </div>
                  </div>

                  <div className="flex flex-col sm:flex-row justify-center gap-3 sm:gap-4 pt-2 sm:pt-4">
                    <button
                      onClick={resetQuiz}
                      className="bg-zinc-900 hover:bg-zinc-800 text-zinc-100 text-sm sm:text-lg font-bold px-6 py-3.5 sm:px-8 sm:py-4 rounded-2xl transition border border-zinc-700"
                    >
                      Diesen Test Wiederholen 🔄
                    </button>
                    <button
                      onClick={autoNextBatch}
                      className="bg-gradient-to-r from-teal-400 to-amber-400 text-black text-sm sm:text-lg font-black px-6 py-3.5 sm:px-8 sm:py-4 rounded-2xl transition shadow-lg shadow-teal-500/20"
                    >
                      ✨ Automatisch Nächste 10 Fragen Starten
                    </button>
                  </div>
                </div>
              )}

            </main>

            {/* Footer */}
            <footer className="border-t border-zinc-800 bg-black p-4 sm:p-6 text-center text-xs sm:text-sm text-zinc-500 font-medium">
              ATA KENNTNISPRÜFUNG • Mehmet Temel
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
