<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATA Kenntnisprüfung & Pharmakologie & Fallbeispiele</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .correct-opt { background-color: #d1fae5 !important; border-color: #10b981 !important; color: #065f46 !important; font-weight: 600; }
        .incorrect-opt { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }
        .disabled-btn { pointer-events: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

    <header class="bg-gradient-to-r from-teal-800 to-cyan-900 text-white py-8 px-4 shadow-lg mb-8">
        <div class="max-w-5xl mx-auto text-center">
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">ATA Kenntnisprüfung - Interaktiver Wissenstest</h1>
            <p class="mt-2 text-teal-100 text-sm sm:text-base">250 Fragen: Allgemeine Kenntnisprüfung (100) • Pharmakologie (100) • Viszeralchirurgische Fallbeispiele (50)</p>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4">
        
        <!-- Controls -->
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6 flex flex-wrap gap-2 justify-center items-center">
            <button onclick="setCategory('kp')" id="btn-kp" class="px-4 py-2 rounded-lg font-medium text-sm transition-all bg-teal-700 text-white shadow-sm">Modul 1: Kenntnisprüfung (100)</button>
            <button onclick="setCategory('pharm')" id="btn-pharm" class="px-4 py-2 rounded-lg font-medium text-sm transition-all bg-slate-200 text-slate-700 hover:bg-slate-300">Modul 2: Pharmakologie (100)</button>
            <button onclick="setCategory('fall')" id="btn-fall" class="px-4 py-2 rounded-lg font-medium text-sm transition-all bg-slate-200 text-slate-700 hover:bg-slate-300">Modul 3: Fallbeispiele (50)</button>
        </div>

        <!-- Scoreboard -->
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6 border-l-4 border-teal-600 flex flex-wrap justify-between items-center text-sm font-semibold text-slate-700">
            <div>Beantwortet: <span id="answered-count">0</span> / <span id="total-count">100</span></div>
            <div>Richtig: <span id="correct-count" class="text-emerald-600">0</span></div>
            <div>Erfolgsquote: <span id="score-percent" class="text-teal-700">0%</span></div>
        </div>

        <!-- Quiz Container -->
        <div id="quiz-container" class="space-y-6"></div>

        <!-- Pagination -->
        <div class="flex justify-between items-center mt-8 bg-white p-4 rounded-xl shadow-sm">
            <button id="prev-btn" onclick="changePage(-1)" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg text-sm font-medium transition-all">← Vorherige</button>
            <span id="page-indicator" class="text-sm font-semibold text-slate-600">Seite 1 von 10</span>
            <button id="next-btn" onclick="changePage(1)" class="px-4 py-2 bg-teal-700 hover:bg-teal-800 text-white rounded-lg text-sm font-medium transition-all">Nächste →</button>
        </div>

    </main>

    <script>
        const questionsData = {
            kp: [
                {
                    q: "Welche Maßnahme hat die höchste Priorität bei Verdacht auf eine Aspiration während der Narkoseeinleitung?",
                    opts: [
                        "Sofortige Lagerung in Trendelenburg-Position und Absaugen des Oropharynx.",
                        "Gabe von Dexamethason i.v. zur Vermeidung einer Entzündungsreaktion.",
                        "Sofortiges Auskultieren der Lunge zur Lokalisation.",
                        "Verabreichung eines Bronchodilators über das Beatmungssystem.",
                        "Bauchlage herstellen, um den Mageninhalt ablaufen zu lassen."
                    ],
                    a: 0,
                    exp: "Bei Aspiration muss der Patient sofort kopftief gelagert (Trendelenburg) und der Mund-Rachen-Raum abgesaugt werden, um das Nachfließen von Mageninhalt in die Trachea zu verhindern."
                },
                {
                    q: "Was gehört nach den Richtlinien des Patientenschutzrechts zur Aufklärungspflicht vor einer Anästhesie?",
                    opts: [
                        "Die verständliche Aufklärung über Risiken, Alternativen und Ablauf durch einen Arzt.",
                        "Die eigenständige Aufklärung des Patienten durch die ATA im Vorbereitungsraum.",
                        "Die schriftliche Information am Tag der Operation unmittelbar vor Narkosebeginn.",
                        "Die reine Aushändigung eines Informationsblattes ohne mündliches Gespräch.",
                        "Die Aufklärung durch das Pflegepersonal der Station am Vorabend."
                    ],
                    a: 0,
                    exp: "Die Aufklärung ist eine nicht-delegierbare ärztliche Aufgabe. Sie muss rechtzeitig und für den Patienten verständlich erfolgen."
                }
            ],
            pharm: [
                {
                    q: "Welche Dosis und welcher Anschlagzeitpunkt (Onset) gelten für Rocuronium bei einer Rapid Sequence Induction (RSI)?",
                    opts: [
                        "1,0 - 1,2 mg/kg KG; Onset ca. 60 Sekunden.",
                        "0,3 mg/kg KG; Onset ca. 3 Minuten.",
                        "0,6 mg/kg KG; Onset ca. 90 Sekunden.",
                        "2,0 mg/kg KG; Onset ca. 30 Sekunden.",
                        "0,1 mg/kg KG; Onset ca. 5 Minuten."
                    ],
                    a: 0,
                    exp: "Für die RSI wird Rocuronium hochdosiert mit 1,0–1,2 mg/kg KG eingesetzt, um nach ca. 60 Sekunden optimale Intubationsbedingungen zu erreichen."
                },
                {
                    q: "Welches Ist die Hauptkontraindikation für die Gabe von Succinylcholin?",
                    opts: [
                        "Maligne Hyperthermie in der Eigen- oder Familienanamnese sowie Hyperkalämie.",
                        "Postoperative Übelkeit und Erbrechen (PONV).",
                        "Bluthochdruck (Hypertonie).",
                        "Leichte Nierenfunktionseinschränkung.",
                        "Adipositas Permagna."
                    ],
                    a: 0,
                    exp: "Succinylcholin ist ein Trigger für Maligne Hyperthermie und führt durch Depolarisation zu einem Kaliumanstieg, was bei vorbestehender Hyperkalämie lebensgefährlich ist."
                }
            ],
            fall: [
                {
                    q: "Fallbeispiel Viszeralchirurgie: Ein 65-jähriger Patient mit akutem Ileus soll notfallmäßig operiert werden. Welches Anästhesieverfahren ist indiziert und wie sichern Sie den Atemweg?",
                    opts: [
                        "Rapid Sequence Induction (RSI) mit Oberkörperhochlagerung, Absaugbereitschaft und ohne Zwischenbeatmung.",
                        "Klassische Narkoseeinleitung mit Maskenbeatmung zur Hypokapnievermeidung.",
                        "TIVA ohne Relaxierung unter Spontanatmung über Kehlkopfmaske.",
                        "Einleitung in Flachlage mit vorheriger Verabreichung von oralem Antazidum.",
                        "Spinalanästhesie bis Th4 zur Vermeidung einer Atemwegssicherung."
                    ],
                    a: 0,
                    exp: "Beim Ileus besteht extrem hohes Aspirationsrisiko (Regurgitation). Indiziert ist eine RSI mit Oberkörperhochlagerung, Verzicht auf Zwischenbeatmung und zügiger Intubation."
                }
            ]
        };

        let currentCat = 'kp';
        let currentPage = 1;
        const itemsPerPage = 10;
        let userAnswers = { kp: {}, pharm: {}, fall: {} };

        function setCategory(cat) {
            currentCat = cat;
            currentPage = 1;
            ['kp', 'pharm', 'fall'].forEach(c => {
                const btn = document.getElementById(`btn-${c}`);
                if (c === cat) {
                    btn.className = "px-4 py-2 rounded-lg font-medium text-sm transition-all bg-teal-700 text-white shadow-sm";
                } else {
                    btn.className = "px-4 py-2 rounded-lg font-medium text-sm transition-all bg-slate-200 text-slate-700 hover:bg-slate-300";
                }
            });
            render();
        }

        function render() {
            const list = questionsData[currentCat] || [];
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            const total = list.length;
            document.getElementById('total-count').innerText = total;

            const start = (currentPage - 1) * itemsPerPage;
            const end = Math.min(start + itemsPerPage, total);
            const pageItems = list.slice(start, end);

            pageItems.forEach((item, idx) => {
                const realIdx = start + idx;
                const answeredOpt = userAnswers[currentCat][realIdx];

                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-xl shadow-sm border border-slate-200";

                let optionsHtml = '';
                item.opts.forEach((opt, oIdx) => {
                    let optStyle = "bg-slate-50 border-slate-200 hover:bg-slate-100";
                    if (answeredOpt !== undefined) {
                        if (oIdx === item.a) optStyle = "correct-opt border";
                        else if (oIdx === answeredOpt) optStyle = "incorrect-opt border";
                        else optStyle = "bg-slate-50 border-slate-200 opacity-60";
                    }

                    optionsHtml += `
                        <button onclick="answer(${realIdx}, ${oIdx})" class="w-full text-left p-3.5 rounded-lg border text-sm transition-all flex items-start gap-3 ${optStyle} ${answeredOpt !== undefined ? 'disabled-btn' : ''}">
                            <span class="font-bold text-slate-500">${String.fromCharCode(65 + oIdx)}.</span>
                            <span class="flex-1">${opt}</span>
                        </button>
                    `;
                });

                let expHtml = '';
                if (answeredOpt !== undefined) {
                    expHtml = `
                        <div class="mt-4 p-4 bg-teal-50 border-l-4 border-teal-600 rounded-r-lg text-xs sm:text-sm text-teal-900">
                            <strong class="block text-teal-950 mb-1">Begründung / Erklärung (Deutsch):</strong>
                            ${item.exp}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="text-xs font-bold text-teal-700 uppercase tracking-wider mb-2">Frage ${realIdx + 1} von ${total}</div>
                    <h3 class="text-base sm:text-lg font-bold text-slate-900 mb-4">${item.q}</h3>
                    <div class="space-y-2.5">${optionsHtml}</div>
                    ${expHtml}
                `;
                container.appendChild(card);
            });

            // Pagination UI
            const totalPages = Math.ceil(total / itemsPerPage) || 1;
            document.getElementById('page-indicator').innerText = `Seite ${currentPage} von ${totalPages}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage === totalPages;

            updateScoreboard();
        }

        function answer(questionIdx, optionIdx) {
            if (userAnswers[currentCat][questionIdx] !== undefined) return;
            userAnswers[currentCat][questionIdx] = optionIdx;
            render();
        }

        function changePage(dir) {
            const list = questionsData[currentCat] || [];
            const totalPages = Math.ceil(list.length / itemsPerPage) || 1;
            
            if (currentPage + dir >= 1 && currentPage + dir <= totalPages) {
                currentPage += dir;
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function updateScoreboard() {
            const list = questionsData[currentCat] || [];
            const answers = userAnswers[currentCat] || {};
            let answered = 0;
            let correct = 0;

            Object.keys(answers).forEach(qIdx => {
                answered++;
                if (answers[qIdx] === list[qIdx].a) correct++;
            });

            document.getElementById('answered-count').innerText = answered;
            document.getElementById('correct-count').innerText = correct;
            const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
            document.getElementById('score-percent').innerText = `${pct}%`;
        }

        // Init
        setCategory('kp');
    </script>
</body>
</html>
