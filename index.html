<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATA KENNTNISPRÜFUNG - Intensiv-Testtrainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      // STANDARD 20 ALLGEMEINE ATA FRAGEN (5 OPTIONEN A-E)
      const DEFAULT_GENERAL_QUESTIONS = [
        {
          question: "Wie hoch sollte der optimale Cuffdruck eines Endotrachealtubus eingestellt sein, um sowohl Aspirationen als auch Schleimhautischämien zu vermeiden?",
          options: ["10 - 15 cmH2O", "20 - 30 cmH2O", "35 - 45 cmH2O", "50 - 60 cmH2O", "70 - 80 cmH2O"],
          answer: 1,
          explanation: "Der Cuffdruck sollte konstant zwischen 20 und 30 cmH2O gehalten werden. Drücke unter 20 cmH2O erhöhen das Aspirationseisiko; Drücke über 30 cmH2O drosseln die Kapillarperfusion der Trachealschleimhaut."
        },
        {
          question: "Welches spezifische Antidot wird zur blitzschnellen Aufhebung einer neuromuskulären Blockade durch Rocuronium verwendet?",
          options: ["Naloxon", "Flumazenil", "Atropin", "Sugammadex (Bridion)", "Neostigmin"],
          answer: 3,
          explanation: "Sugammadex umschließt Rocuronium-Moleküle im Plasma in einem 1:1-Komplex und hebt deren Wirkung innerhalb kürzester Zeit auf."
        },
        {
          question: "Welches Gesetz regelt in Deutschland primär die Aufklärungspflicht des Arztes und die Rechte des Patienten vor einem Eingriff?",
          options: ["Arbeitsschutzgesetz (ArbSchG)", "Patientenrechtegesetz (§ 630e BGB)", "Infektionsschutzgesetz (IfSG)", "Betäubungsmittelgesetz (BtMG)", "Medizinproduktegesetz (MPG)"],
          answer: 1,
          explanation: "Gemäß § 630e BGB (Patientenrechtegesetz) muss die Aufklärung rechtzeitig, verständlich und umfassend über Risiken und Alternativen erfolgen."
        },
        {
          question: "Was ist der sicherste klinische Nachweis für die korrekte endotracheale Tubuslage direkt nach der Intubation?",
          options: ["Beidseitig sichtbare Thoraxhebung", "Auskultation der Lungenfelder", "Kontinuierliche Kapnografie (etCO2-Messung über mind. 3 Beatmungshübe)", "Fehlen von Magengeräuschen", "Beschlagen des Tubuskanals"],
          answer: 2,
          explanation: "Die kontinuierliche Kapnografie mit einer regelrechten CO2-Auslenkung über mehrere Beatmungshübe gilt als unumstrittener Goldstandard zur Lagenachweis-Bestätigung."
        },
        {
          question: "Welche Rocuronium-Dosierung ist nach aktuellen Leitlinien für eine Rapid Sequence Induction (RSI / Blitzeinleitung) indiziert?",
          options: ["0,1 mg/kg kgKG", "0,3 mg/kg kgKG", "0,6 mg/kg kgKG", "1,2 mg/kg kgKG", "2,0 mg/kg kgKG"],
          answer: 3,
          explanation: "Bei der RSI wird die doppelte Standarddosis (1,2 mg/kg kgKG) verabreicht, um innerhalb von ca. 60 Sekunden optimale Intubationsbedingungen zu schaffen."
        },
        {
          question: "Welche Kombination von Substanzen gilt als absoluter Haupttrigger für eine Maligne Hyperthermie (MH)?",
          options: ["Propofol und Fentanyl", "Volatile Anästhetika (z. B. Sevofluran) und Succinylcholin", "Midazolam und Remifentanil", "Rocuronium und Sugammadex", "Ketamin und Atropin"],
          answer: 1,
          explanation: "Inhalationsanästhetika sowie Succinylcholin triggern bei genetischer Disposition eine unkontrollierte Calciumfreisetzung in der Skelettmuskulatur."
        },
        {
          question: "Was beschreibt der Begriff 'MAC-1-Wert' bei inhalativen Anästhetika?",
          options: ["Minimaler Atemwegsdruck unter Beatmung", "Konzentration, bei der 50 % der Patienten auf einen Hautschnitt nicht mehr mit einer Abwehrbewegung reagieren", "Maximale Sauerstoffkonzentration im Kreisteil", "Narkosegasdruck im Verdampfer", "Konzentration zur vollständigen Muskelrelaxierung"],
          answer: 1,
          explanation: "Der MAC-Wert (Minimale Alveoläre Konzentration) ist ein Maß für die Potenz eines Narkosegases. MAC 1 unterdrückt Schmerzreaktionen bei 50 % der Patienten."
        },
        {
          question: "Welche Folge hat ein vollständig erschöpfter Atemkalk (CO2-Absorber) im halbgeschlossenen Kreissystem?",
          options: ["Starker Abfall des Systemdrucks", "Anstieg des inspiratorischen CO2-Wertes (Rebreathing / Hyperkapnie)", "Plötzlicher Abfall der Sauerstoffsättigung", "Schnellere Narkosegas-Verdampfung", "Ausfall des EKG-Monitors"],
          answer: 1,
          explanation: "Erschöpfter Atemkalk kann ausgeatmetes CO2 nicht mehr binden. Das CO2 wird wieder eingeatmet, was zu Hyperkapnie beim Patienten führt."
        },
        {
          question: "Welches Erstlinien-Medikament wird typischerweise als Bolus gegeben, um einen Narkose-induzierten Blutdruckabfall zu therapieren?",
          options: ["Akrinor (Cafedrin/Theodrenalin)", "Atropin", "Amiodaron", "Furosemid", "Propofol"],
          answer: 0,
          explanation: "Akrinor steigert effektiv den Blutdruck und das Herzzeitvolumen nach der Narkoseeinleitung, ohne eine ausgeprägte Frequenzänderung zu bewirken."
        },
        {
          question: "Bei welcher Cormack-Lehane-Klassifikation ist bei der Laryngoskopie ausschließlich der weiche Gaumen/Zungengrund sichtbar?",
          options: ["Grad I", "Grad II", "Grad III", "Grad IV", "Grad V"],
          answer: 3,
          explanation: "Grad IV bedeutet, dass weder Epiglottis noch Stimmbänder einsehbar sind. Es liegt ein extrem schwieriger Atemweg vor."
        },
        {
          question: "Welches Opioid weist in der klinischen Anästhesie die stärkste analgetische Potenz auf?",
          options: ["Morphin", "Fentanyl", "Sufentanil", "Remifentanil", "Piritramid"],
          answer: 2,
          explanation: "Sufentanil besitzt etwa die 700- bis 1000-fache analgetische Potenz von Morphin und ist damit das potenteste verfügbare Opioid."
        },
        {
          question: "Welches Notfallmedikament muss bei der Erstbehandlung einer Malignen Hyperthermie unverzüglich i.v. verabreicht werden?",
          options: ["Dantrolen", "Noradrenalin", "Prednisolon", "Physostigmin", "Amiodaron"],
          answer: 0,
          explanation: "Dantrolen hemmt die Freisetzung von Calcium aus dem sarkoplasmatischen Retikulum und ist das einzige spezifische Notfalltherapeutikum bei MH."
        },
        {
          question: "Wie berechnet sich das Ziel-Zugvolumen (Vt) bei der lungenprotektiven Beatmung?",
          options: ["12 - 15 ml/kg tatsächliches Körpergewicht", "6 - 8 ml/kg ideales Körpergewicht (IBW)", "15 - 20 ml/kg ideales Körpergewicht", "Pauschal immer 800 ml", "2 - 4 ml/kg tatsächliches Körpergewicht"],
          answer: 1,
          explanation: "Lungenprotektive Beatmung vermeidet Baro- und Volutraumen durch Begrenzung des Tidalvolumens auf 6-8 ml/kg des berechneten idealen Körpergewichts."
        },
        {
          question: "Welcher TOF-Quotient (Train-of-Four) muss vor der Extubation erreicht sein, um eine postoperative Restrelaxierung sicher auszuschließen?",
          options: ["TOF-Ratio > 0,25 (25 %)", "TOF-Ratio > 0,50 (50 %)", "TOF-Ratio > 0,75 (75 %)", "TOF-Ratio > 0,90 (90 %)", "TOF-Count 1/4"],
          answer: 3,
          explanation: "Ein TOF-Quotient von mindestens 0,90 (90 %) garantiert die Wiederherstellung der vollen Muskelkraft und verhindert hypoxische Komplikationen."
        },
        {
          question: "Welche Gefahr besteht bei der Nutzung von ausgetrocknetem Atemkalk in Kombination mit Sevofluran?",
          options: ["Bildung von nephrotoxischem Compound A sowie Kohlenmonoxid (CO)", "Laryngospasmus", "Hyperglykämie", "Maligne Hyperthermie", "Anaphylaktischer Schock"],
          answer: 0,
          explanation: "Ausgetrockneter Atemkalk degradiert Sevofluran zu toxischem Compound A und kann zudem lebensgefährliches Kohlenmonoxid freisetzen."
        },
        {
          question: "Welcher Venenzugang entspricht nach der internationalen ISO-Farbcodierung einer Nadelgröße von 18 Gauge (G18)?",
          options: ["Blau (22 G)", "Rosa (20 G)", "Grün (18 G)", "Weiß (16 G)", "Orange (14 G)"],
          answer: 2,
          explanation: "Die Farbcodierung lautet: Blau = 22G, Rosa = 20G, Grün = 18G, Weiß = 16G, Orange = 14G."
        },
        {
          question: "Welche Leitsymptom-Trias deutet unter Anästhesie auf das Vorliegen einer schweren Anaphylaxie hin?",
          options: ["Blutdruckabfall, Bronchospasmus/Exanthem, Tachykardie", "Bradykardie, Hypertonie, Miosis", "Hyperthermie, Muskelrigor, Mydriasis", "Polyurie, Hypokapnie, Erbrechen", "Hypothermie, Bradypnoe, Tremor"],
          answer: 0,
          explanation: "Eine Anaphylaxie manifestiert sich am kardiovaskulären System (Hypotonie, Tachykardie), am Respirationstrakt (Bronchospasmus) und an der Haut."
        },
        {
          question: "Welcher Nerv droht bei einer unzureichend gepolsterten Steinschnittlagerung am Fibulaköpfchen geschädigt zu werden?",
          options: ["Nervus femoralis", "Nervus peroneus communis", "Nervus ischiadicus", "Nervus obturatorius", "Nervus saphenus"],
          answer: 1,
          explanation: "Der N. peroneus communis verläuft direkt um das Fibulaköpfchen und ist bei Steinschnittlagerung extrem druckempfindlich."
        },
        {
          question: "Was ist das primäre Ziel der Präoxygenierung mit 100 % Sauerstoff vor der Narkoseeinleitung?",
          options: ["Senkung des arteriellen Blutdrucks", "Auswaschen von Stickstoff aus der FRC zur Verlängerung der Apnoetoleranzzeit", "Vermeidung einer Hyperkapnie", "Aktivierung der Muskelrelaxanzien", "Reduktion des Speichelflusses"],
          answer: 1,
          explanation: "Durch die Denitrogenierung der funktionellen Residualkapazität (FRC) wird ein Sauerstoffreservoir aufgebaut, das die sicher tolerierte Apnoezeit deutlich erhöht."
        },
        {
          question: "Wer trägt nach deutschem Recht die strafrechtliche Durchführungsverantwortung bei der Verabreichung von Anästhetika?",
          options: ["Ausschließlich der Chefarzt", "Die durchführende Fachkraft (z. B. ATA/Pflegekraft)", "Der Hersteller des Medikaments", "Der Klinikleiter", "Die OP-Leitung"],
          answer: 1,
          explanation: "Neben der Anordnungsverantwortung des Arztes trägt die Person, die das Medikament aufzieht und injiziert, die persönliche Durchführungsverantwortung."
        }
      ];

      // STANDARD 20 FALLBASIERTE ATA FRAGEN (CASE-BASED, 5 OPTIONEN)
      const DEFAULT_CASE_QUESTIONS = [
        {
          patientInfo: "PATIENTENFALL: 68-jähriger Patient (82 kg), Notfall-OP bei akutem Ileus. Vorerkrankungen: COPD und arterielle Hypertonie. Letzte Nahrungsaufnahme vor 2 Stunden.",
          question: "Welches Anästhesieverfahren ist für die Narkoseeinleitung zwingend indiziert?",
          options: [
            "Klassische balancierte Einleitung mit Maskenbeatmung",
            "Rapid Sequence Induction (RSI) ohne Zwischenbeatmung",
            "Total Intravenöse Anästhesie (TIVA) mit Larynxmaske",
            "Spinalanästhesie im Sitzen",
            "Regionalanästhesie des Plexus brachialis"
          ],
          answer: 1,
          explanation: "Bei akutem Ileus besteht hohes Aspirationsrisiko (Nicht-Nüchternheit). Indiziert ist eine RSI ohne Zwischenbeatmung, um Mageninhalt-Aspiration zu verhindern."
        },
        {
          patientInfo: "PATIENTENFALL: 45-jährige Patientin während einer laparoskopischen Cholezystektomie. Narkoseführung mit Sevofluran und Sufentanil. Plötzlich steigen etCO2 von 36 auf 65 mmHg, die Frequenz auf 130/min und die Körpertemperatur rasch an.",
          question: "Welche akute Narkosekomplikation liegt hier vor und was ist die erste Maßnahme?",
          options: [
            "Anaphylaxie; Gabe von Adrenalin",
            "Maligne Hyperthermie; Stopp aller Triggergase, 100% O2 High-Flow, Dantrolengabe",
            "CO2-Embolie; Patient in Kopftieflagerung bringen",
            "Opioid-Überdosierung; Gabe von Naloxon",
            "Pneumothorax; Sofortige Entlastungspunktion"
          ],
          answer: 1,
          explanation: "Anstieg von etCO2, Tachykardie und Hyperthermie sind Leitsymptome der Malignen Hyperthermie. Inhalationsanästhetika sofort stoppen, mit 100% O2 überbeatmen und Dantrolen verabreichen."
        },
        {
          patientInfo: "PATIENTENFALL: 72-jähriger Patient nach einer 4-stündigen Baucheingriff im Aufwachraum. Der Patient ist schläfrig, die Atemfrequenz liegt bei 6/min und die SpO2 fällt unter Raumluft auf 88 %.",
          question: "Welche Ursache ist am wahrscheinlichsten und wie wird primär therapiert?",
          options: [
            "Postoperative Restrelaxierung; Reversierung mit Sugammadex",
            "Opioid-Überhang; Atemstimulierung, O2-Gabe, ggf. fraktionierte Naloxongabe",
            "Lungenembolie; Sofortige Thrombolyse",
            "Volumenmangel; Rasche Infusion von 2000 ml Vollblut",
            "Pneumonie; Einleitung einer Antibiose"
          ],
          answer: 1,
          explanation: "Eine Bradypnoe (AF 6/min) mit Hypoxie nach OP deutet auf einen Opioid-Überhang hin. Nach O2-Sicherung kann vorsichtig Naloxon titriert werden."
        },
        {
          patientInfo: "PATIENTENFALL: 30-jährige Patientin, 2 Minuten nach Injektion von 150 mg Propofol und 20 µg Sufentanil zur Einleitung. Der Blutdruck fällt von 120/70 auf 80/45 mmHg. Die Herzfrequenz bleibt stabil bei 72/min.",
          question: "Was ist die physiologische Ursache für diesen Blutdruckabfall?",
          options: [
            "Anaphylaktischer Schock Grad IV",
            "Akuter Myokardinfarkt",
            "Propofol-induzierte Vasodilatation und Senkung des sympathischen Tonus",
            "Volumenüberladung",
            "Maligne Hyperthermie"
          ],
          answer: 2,
          explanation: "Propofol führt zur peripheren Vasodilatation (Venodilation) und Dämpfung des Sympathikus, was zu einem häufigen, typischen Blutdruckabfall nach Einleitung führt."
        },
        {
          patientInfo: "PATIENTENFALL: 55-jähriger Patient, Intubation geplant. Bei der Laryngoskopie sieht der Anästhesist lediglich die Epiglottis, jedoch keine Stimmbandstrukturen (Cormack-Lehane Grad III).",
          question: "Welche Maßnahme ist im Algorithmus für den schwierigen Atemweg nun am sinnvollsten?",
          options: [
            "Narkose sofort beenden und Patient aufwecken",
            "Einsatz eines Videolaryngoskops oder Intubations-Bougies (Führungsstab)",
            "Blinde Koniotomie durchführen",
            "Tubus ohne Sicht in die Speiseröhre schieben",
            "Tracheotomie im OP-Saal veranlassen"
          ],
          answer: 1,
          explanation: "Bei Cormack-Lehane III verbessert das Videolaryngoskop oder die Nutzung eines elastischen Bougies die Sicht bzw. Führung des Tubus entscheidend."
        }
      ];

      function App() {
        const [activeMode, setActiveMode] = useState('general'); // 'general' oder 'case'
        const [questionsList, setQuestionsList] = useState(DEFAULT_GENERAL_QUESTIONS);
        const [currentQ, setCurrentQ] = useState(0);
        const [selectedOption, setSelectedOption] = useState(null);
        const [score, setScore] = useState(0);
        const [showExplanation, setShowExplanation] = useState(false);
        const [quizFinished, setQuizFinished] = useState(false);
        const [aiGeneratingQuestions, setAiGeneratingQuestions] = useState(false);

        // AI State
        const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
        const [isApiKeySaved, setIsApiKeySaved] = useState(!!localStorage.getItem('gemini_api_key'));

        const handleSaveApiKey = () => {
          localStorage.setItem('gemini_api_key', apiKey);
          setIsApiKeySaved(true);
        };

        const switchMode = (mode) => {
          setActiveMode(mode);
          if (mode === 'general') {
            setQuestionsList(DEFAULT_GENERAL_QUESTIONS);
          } else {
            setQuestionsList(DEFAULT_CASE_QUESTIONS);
          }
          resetQuiz();
        };

        const generate20QuestionsWithAI = async () => {
          if (!apiKey) {
            alert("Bitte geben Sie zuerst oben Ihren Gemini API-Schlüssel ein!");
            return;
          }
          setAiGeneratingQuestions(true);

          const isCaseMode = activeMode === 'case';
          const prompt = isCaseMode
            ? `Erstelle genau 20 anspruchsvolle fallbasierte Multiple-Choice-Fragen auf Deutsch für die Anästhesietechnische Assistent (ATA) Kenntnisprüfung (KP) in Deutschland.
               Jede Frage MUSS ein Objekt mit "patientInfo" (kurzer klinischer Fall), "question" (Frage), "options" (genau 5 Antwortoptionen A-E), "answer" (Index 0-4) und "explanation" (Erklärung) sein.
               Themen: Anästhesie-Pharmakologie, Notfälle, Rechtskunde, Atemweg, Geräte.
               Antworte STRENG als JSON-Array von 20 Objekten ohne Codeblock-Tags.`
            : `Erstelle genau 20 anspruchsvolle allgemeine Multiple-Choice-Fragen auf Deutsch für die Anästhesietechnische Assistent (ATA) Kenntnisprüfung (KP) in Deutschland.
               Jede Frage MUSS ein Objekt mit "question" (Frage), "options" (genau 5 Antwortoptionen A-E), "answer" (Index 0-4) und "explanation" (Erklärung) sein.
               Themen: Anästhesietechnik, Pharmakologie, Notfallmedizin, Rechtskunde, Krankenhausrecht, Narkosegeräte.
               Antworte STRENG als JSON-Array von 20 Objekten ohne Codeblock-Tags.`;

          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            const text = data.candidates[0].content.parts[0].text;
            const cleanJson = text.replace(/```json|```/g, '').trim();
            const newQuestions = JSON.parse(cleanJson);

            if (Array.isArray(newQuestions) && newQuestions.length > 0) {
              setQuestionsList(newQuestions);
              resetQuiz();
            }
          } catch (err) {
            alert("Fehler bei der KI-Generierung: " + err.message);
          } finally {
            setAiGeneratingQuestions(false);
          }
        };

        const handleOptionClick = (index) => {
          if (selectedOption !== null) return;
          setSelectedOption(index);
          setShowExplanation(true);
          if (index === questionsList[currentQ].answer) {
            setScore(score + 1);
          }
        };

        const handleNextQuestion = () => {
          setSelectedOption(null);
          setShowExplanation(false);
          if (currentQ + 1 < questionsList.length) {
            setCurrentQ(currentQ + 1);
          } else {
            setQuizFinished(true);
          }
        };

        const resetQuiz = () => {
          setCurrentQ(0);
          setSelectedOption(null);
          setScore(0);
          setShowExplanation(false);
          setQuizFinished(false);
        };

        const optionLabels = ["A", "B", "C", "D", "E"];

        return (
          <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100 font-sans">
            {/* Header */}
            <header className="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-50 px-6 py-5">
              <div className="max-w-7xl mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
                <div className="flex items-center gap-4">
                  <span className="text-5xl">🫁</span>
                  <div>
                    <h1 className="text-3xl lg:text-4xl font-black bg-gradient-to-r from-teal-400 via-cyan-300 to-amber-300 bg-clip-text text-transparent tracking-wide">
                      ATA KENNTNISPRÜFUNG
                    </h1>
                    <p className="text-base text-slate-400 font-semibold">Exklusiver KI-Prüfungs-Trainer für Anästhesie & Recht</p>
                  </div>
                </div>

                {/* API Key Box */}
                <div className="flex items-center gap-3 bg-slate-950 p-2 rounded-2xl border border-slate-800">
                  <input 
                    type="password" 
                    placeholder="Gemini API Key eingeben" 
                    value={apiKey} 
                    onChange={(e) => setApiKey(e.target.value)}
                    className="bg-slate-900 text-slate-100 px-4 py-2 rounded-xl border border-slate-700 text-sm focus:outline-none focus:border-teal-400 w-48 lg:w-60"
                  />
                  <button 
                    onClick={handleSaveApiKey}
                    className="bg-teal-500 hover:bg-teal-400 text-slate-950 font-extrabold px-4 py-2 rounded-xl text-sm transition"
                  >
                    {isApiKeySaved ? 'Gespeichert ✓' : 'Speichern'}
                  </button>
                </div>
              </div>
            </header>

            {/* Test Modus Auswahl */}
            <div className="bg-slate-900 border-b border-slate-800 px-6 py-4">
              <div className="max-w-7xl mx-auto flex flex-col sm:flex-row gap-4 justify-center">
                <button
                  onClick={() => switchMode('general')}
                  className={`px-6 py-4 rounded-2xl text-xl font-extrabold transition flex items-center justify-center gap-3 border-2 ${
                    activeMode === 'general'
                      ? 'bg-amber-500/20 border-amber-400 text-amber-300 shadow-lg shadow-amber-500/10'
                      : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-slate-200'
                  }`}
                >
                  📝 1. Allgemeiner Prüfungstest (Anästhesie & Recht)
                </button>
                <button
                  onClick={() => switchMode('case')}
                  className={`px-6 py-4 rounded-2xl text-xl font-extrabold transition flex items-center justify-center gap-3 border-2 ${
                    activeMode === 'case'
                      ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300 shadow-lg shadow-cyan-500/10'
                      : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-slate-200'
                  }`}
                >
                  🏥 2. Fallbasierter Prüfungstest (Vaka Testi)
                </button>
              </div>
            </div>

            {/* Main Content Area */}
            <main className="max-w-5xl mx-auto p-6 flex-1 w-full space-y-6">
              
              {/* KI-Generierung Bar */}
              <div className="bg-slate-900 border border-slate-800 p-5 rounded-3xl flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                  <h3 className="text-xl font-bold text-teal-300">Unendlicher KI-Prüfungsmodus</h3>
                  <p className="text-base text-slate-400">Generieren Sie per Knopfdruck 20 völlig neue Fragen auf deutschem Prüfungsniveau.</p>
                </div>
                <button
                  onClick={generate20QuestionsWithAI}
                  disabled={aiGeneratingQuestions}
                  className="bg-gradient-to-r from-amber-400 to-teal-400 hover:opacity-90 text-slate-950 text-base font-black px-6 py-3.5 rounded-2xl transition shadow-lg shadow-teal-500/20 disabled:opacity-50 whitespace-nowrap"
                >
                  {aiGeneratingQuestions ? 'Generiere 20 Fragen...' : '✨ 20 Neue KI-Fragen Laden'}
                </button>
              </div>

              {!quizFinished ? (
                <div className="bg-slate-900 border-2 border-slate-800 p-6 sm:p-10 rounded-3xl space-y-8 relative shadow-2xl">
                  
                  {/* Fortschrittsbalken */}
                  <div className="space-y-2">
                    <div className="flex justify-between items-center text-lg font-bold">
                      <span className="text-teal-400 font-mono">
                        Frage {currentQ + 1} von {questionsList.length}
                      </span>
                      <span className="bg-slate-950 px-4 py-1.5 rounded-full border border-slate-800 text-amber-300 font-mono">
                        Aktueller Score: {score}
                      </span>
                    </div>
                    <div className="w-full bg-slate-950 h-3 rounded-full overflow-hidden border border-slate-800">
                      <div 
                        className="bg-gradient-to-r from-teal-400 via-cyan-400 to-amber-400 h-full transition-all duration-300"
                        style={{ width: `${((currentQ + 1) / questionsList.length) * 100}%` }}
                      ></div>
                    </div>
                  </div>

                  {/* Fallbeispiel Anzeige (Falls Fallbasierter Modus) */}
                  {questionsList[currentQ]?.patientInfo && (
                    <div className="bg-slate-950 p-6 rounded-2xl border-l-8 border-l-cyan-400 border border-slate-800 space-y-2">
                      <span className="text-sm font-black text-cyan-400 uppercase tracking-widest block">Klinischer Patientenfall</span>
                      <p className="text-xl text-slate-200 leading-relaxed font-medium">
                        {questionsList[currentQ].patientInfo}
                      </p>
                    </div>
                  )}

                  {/* Fragetext */}
                  <h2 className="text-2xl sm:text-3xl font-extrabold text-amber-300 leading-snug">
                    {questionsList[currentQ]?.question}
                  </h2>

                  {/* 5 Antwort-Optionen (A, B, C, D, E) */}
                  <div className="grid gap-4">
                    {questionsList[currentQ]?.options.map((opt, idx) => {
                      let btnStyle = "bg-indigo-950/40 border-indigo-900/60 text-slate-100 hover:border-teal-400 hover:bg-slate-800";
                      
                      if (selectedOption !== null) {
                        if (idx === questionsList[currentQ].answer) {
                          btnStyle = "bg-emerald-950 border-2 border-emerald-400 text-emerald-100 font-extrabold shadow-lg shadow-emerald-500/20";
                        } else if (idx === selectedOption) {
                          btnStyle = "bg-rose-950 border-2 border-rose-500 text-rose-200 font-extrabold";
                        } else {
                          btnStyle = "bg-slate-950 border-slate-900 text-slate-600 opacity-30";
                        }
                      }

                      return (
                        <button
                          key={idx}
                          onClick={() => handleOptionClick(idx)}
                          disabled={selectedOption !== null}
                          className={`w-full text-left p-5 sm:p-6 rounded-2xl border-2 transition-all duration-150 text-xl flex items-center gap-4 ${btnStyle}`}
                        >
                          <span className="w-10 h-10 rounded-xl bg-slate-900 border border-slate-700 flex items-center justify-center font-mono font-black text-lg text-amber-400 shrink-0">
                            {optionLabels[idx]}
                          </span>
                          <span className="flex-1 leading-relaxed">{opt}</span>
                          {selectedOption !== null && idx === questionsList[currentQ].answer && (
                            <span className="text-emerald-400 font-black text-2xl">✓</span>
                          )}
                        </button>
                      );
                    })}
                  </div>

                  {/* Erklärung und Nächste Frage */}
                  {showExplanation && (
                    <div className="space-y-6 pt-6 border-t border-slate-800 animate-fadeIn">
                      <div className="bg-slate-950 p-6 rounded-2xl border border-teal-500/40 text-lg text-slate-200 space-y-2">
                        <strong className="text-teal-400 text-xl block">Klinische / Rechtliche Begründung:</strong>
                        <p className="leading-relaxed">{questionsList[currentQ].explanation}</p>
                      </div>
                      <button
                        onClick={handleNextQuestion}
                        className="w-full bg-gradient-to-r from-teal-400 to-cyan-400 hover:opacity-90 text-slate-950 font-black py-5 rounded-2xl text-2xl transition shadow-xl shadow-teal-500/20"
                      >
                        {currentQ + 1 < questionsList.length ? 'Nächste Frage →' : 'Testergebnis & Statistik Anzeigen 🏆'}
                      </button>
                    </div>
                  )}

                </div>
              ) : (
                /* Ausführliche Statistik nach 20 Fragen */
                <div className="bg-slate-900 border-2 border-slate-800 p-8 sm:p-12 rounded-3xl text-center space-y-8 shadow-2xl">
                  <span className="text-8xl">🏆</span>
                  <h2 className="text-4xl font-black text-teal-300">Prüfungsdurchgang Beendet!</h2>
                  
                  <div className="grid sm:grid-cols-3 gap-6 max-w-3xl mx-auto">
                    <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-2">
                      <p className="text-sm text-slate-400 font-bold uppercase tracking-wider">Erreichte Punkte</p>
                      <p className="text-5xl font-black text-amber-400 font-mono">{score} / {questionsList.length}</p>
                    </div>
                    <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-2">
                      <p className="text-sm text-slate-400 font-bold uppercase tracking-wider">Erfolgsquote</p>
                      <p className="text-5xl font-black text-cyan-400 font-mono">
                        {Math.round((score / questionsList.length) * 100)} %
                      </p>
                    </div>
                    <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-2">
                      <p className="text-sm text-slate-400 font-bold uppercase tracking-wider">Bewertung</p>
                      <p className="text-3xl font-black text-emerald-400 font-mono pt-2">
                        {(score / questionsList.length) >= 0.75 ? "BESTANDEN ✓" : "NICHT BESTANDEN ✗"}
                      </p>
                    </div>
                  </div>

                  <div className="flex flex-col sm:flex-row justify-center gap-4 pt-4">
                    <button
                      onClick={resetQuiz}
                      className="bg-slate-800 hover:bg-slate-700 text-slate-100 text-xl font-bold px-8 py-4 rounded-2xl transition border border-slate-700"
                    >
                      Diesen Test Wiederholen 🔄
                    </button>
                    <button
                      onClick={generate20QuestionsWithAI}
                      className="bg-gradient-to-r from-teal-400 to-amber-400 text-slate-950 text-xl font-black px-8 py-4 rounded-2xl transition shadow-lg shadow-teal-500/20"
                    >
                      ✨ 20 Neue KI-Fragen Generieren
                    </button>
                  </div>
                </div>
              )}

            </main>

            {/* Footer */}
            <footer className="border-t border-slate-800 bg-slate-950 p-6 text-center text-sm text-slate-500 font-medium">
              ATA KENNTNISPRÜFUNG • Anästhesietechnischer Assistent Online-Testtrainer
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
