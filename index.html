<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehmet Temel - ATA Kenntnisprüfung & Anästhesie-Pharmakologie Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { background-color: #000000; color: #f8fafc; }
        .correct-opt { background-color: #064e3b !important; border-color: #10b981 !important; color: #a7f3d0 !important; font-weight: 600; }
        .incorrect-opt { background-color: #7f1d1d !important; border-color: #ef4444 !important; color: #fecaca !important; }
        .disabled-btn { pointer-events: none; }
        .hidden-opt { opacity: 0.15; pointer-events: none; }
    </style>
</head>
<body class="bg-black text-slate-100 font-sans min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-black border-b border-slate-800 text-white py-6 px-4 shadow-2xl mb-8">
        <div class="max-w-4xl mx-auto text-center">
            <div class="inline-block px-3 py-1 bg-teal-950 text-teal-400 text-xs font-bold rounded-full mb-2 border border-teal-800 tracking-wide">
                LERNPLATFORM VON MEHMET TEMEL
            </div>
            <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight text-teal-400">Mehmet Temel - ATA Kenntnisprüfung</h1>
            <p class="mt-1 text-slate-400 text-xs sm:text-sm">200 Einzigartige Fragen • Gamification • Ausführliche Erklärungen</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4">
        
        <!-- Controls / Modulwahl -->
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 mb-6 flex flex-wrap gap-2 justify-center items-center shadow-lg">
            <button onclick="setCategory('kp')" id="btn-kp" class="px-5 py-2.5 rounded-lg font-medium text-xs sm:text-sm transition-all bg-teal-600 text-white shadow-sm">Modul 1: ATA Kenntnisprüfung (100)</button>
            <button onclick="setCategory('pharm')" id="btn-pharm" class="px-5 py-2.5 rounded-lg font-medium text-xs sm:text-sm transition-all bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800">Modul 2: Anästhesie-Pharmakologie (100)</button>
        </div>

        <!-- Gamification & Scoreboard Bar -->
        <div class="bg-slate-950 border-l-4 border-teal-500 border-y border-r border-slate-800 rounded-xl p-4 mb-6 grid grid-cols-2 sm:grid-cols-5 gap-3 text-center text-xs sm:text-sm font-semibold text-slate-300 shadow-lg">
            <div class="bg-black/50 p-2 rounded-lg border border-slate-800">
                <span class="block text-slate-500 text-[10px] uppercase">Fortschritt</span>
                <span id="answered-count" class="text-white font-bold">0</span> / <span id="total-count" class="text-white font-bold">100</span>
            </div>
            <div class="bg-black/50 p-2 rounded-lg border border-slate-800">
                <span class="block text-slate-500 text-[10px] uppercase">Erfolgsquote</span>
                <span id="score-percent" class="text-teal-400 font-bold">0%</span>
            </div>
            <div class="bg-black/50 p-2 rounded-lg border border-slate-800">
                <span class="block text-slate-500 text-[10px] uppercase">Combo Streak</span>
                <span id="streak-count" class="text-amber-400 font-bold">🔥 0</span>
            </div>
            <div class="bg-black/50 p-2 rounded-lg border border-slate-800">
                <span class="block text-slate-500 text-[10px] uppercase">Leben</span>
                <span id="hearts-display" class="text-rose-500 font-bold">❤️❤️❤️</span>
            </div>
            <div class="bg-black/50 p-2 rounded-lg border border-slate-800 col-span-2 sm:col-span-1">
                <span class="block text-slate-500 text-[10px] uppercase">Rang / Level</span>
                <span id="rank-display" class="text-emerald-400 font-bold text-xs">Schüler</span>
            </div>
        </div>

        <!-- Quiz Container -->
        <div id="quiz-container"></div>

        <!-- Bottom Navigation & Joker -->
        <div class="flex flex-wrap justify-between items-center gap-3 mt-6 bg-slate-950 border border-slate-800 p-4 rounded-xl shadow-xl">
            <button id="prev-btn" onclick="changePage(-1)" class="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-white rounded-lg text-sm font-medium transition-all disabled:opacity-30 disabled:cursor-not-allowed">← Vorherige</button>
            
            <button id="joker-btn" onclick="useFiftyFifty()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-black font-bold rounded-lg text-xs transition-all shadow-md flex items-center gap-1.5">
                <span>🃏 50:50 Joker</span>
            </button>

            <span id="page-indicator" class="text-xs sm:text-sm font-semibold text-slate-400">Frage 1 von 100</span>
            
            <button id="next-btn" onclick="changePage(1)" class="px-5 py-2.5 bg-teal-600 hover:bg-teal-500 text-white rounded-lg text-sm font-medium transition-all disabled:opacity-30 disabled:cursor-not-allowed">Nächste →</button>
        </div>

    </main>

    <script>
        // Generatorkonfiguration für 100 vollkommen einzigartige Themenfragen pro Modul
        const kpTopics = [
            { t: "Aspiration & RSI", q: "Was ist die allererste Sofortmaßnahme bei stattgefundener Regurgitation während der Einleitung?", o: ["Trendelenburg-Lagerung und Absaugen im Mund-Rachen-Raum.", "Sofortige Gabe von Dexamethason i.v.", "Auskultation der Lungenfelder.", "Gabe von Bronchodilatatoren.", "Bauchlage herstellen."], e: "Bei Regurgitation/Aspiration verhindert die sofortige Trendelenburg-Lagerung das weitere Nachfließen von Mageninhalt in die Trachea." },
            { t: "Patientenrechte", q: "Wer darf die anästhesiologische Aufklärung des Patienten rechtsgültig durchführen?", o: ["Ausschließlich der zuständige Anästhesist.", "Jede erfahrene ATA im Vorbereitungsraum.", "Das Pflegepersonal der Station.", "Der Medizinstudent im praktischen Jahr ohne Aufsicht.", "Der OP-Manager."], e: "Aufklärung ist eine nicht-delegierbare ärztliche Leistung." },
            { t: "Hygiene", q: "Wann müssen sterile Handschuhe getragen werden?", o: ["Bei allen invasiven Maßnahmen wie ZVK-Legen oder Arterieller Punktion.", "Bei der normalen Blutdruckmessung.", "Bei der Konnektierung von Infusionen an Venenverweilkanülen.", "Beim Anlegen von EKG-Elektroden.", "Ausschließlich im Aufwachraum."], e: "Aseptisches Arbeiten verlangt sterile Handschuhe bei allen invasiven Gefäßzugängen." },
            { t: "Nüchternheit", q: "Wie lange vor einer elektiven Narkose dürfen klare Flüssigkeiten getrunken werden?", o: ["Bis zu 2 Stunden vor Narkosebeginn.", "Bis zu 6 Stunden vorher.", "Ab 0:00 Uhr gar nichts mehr.", "Bis zu 30 Minuten vorher.", "Bis zu 12 Stunden vorher."], e: "Moderne Leitlinien erlauben klare Flüssigkeiten bis 2 Stunden präoperativ." },
            { t: "Wärmemanagement", q: "Ab welcher Körperkerntemperatur spricht man von einer perioperativen Hypothermie?", o: ["Unter 36,0 °C", "Unter 37,0 °C", "Unter 35,0 °C", "Unter 34,5 °C", "Unter 36,5 °C"], e: "Eine Temperatur < 36,0 °C definiert die Hypothermie und erhöht Komplikationsraten." },
            { t: "Lagerungsschäden", q: "Welcher Nerv droht bei extremer Überstreckung der Arme (>90°) geschädigt zu werden?", o: ["Plexus brachialis", "Nervus femoralis", "Nervus ulnaris", "Nervus vagus", "Nervus phrenicus"], e: "Eine Abduktion über 90° führt zur Überdehnung des Plexus brachialis." },
            { t: "Maligne Hyperthermie", q: "Was ist das frühste und empfindlichste Symptom einer Malignen Hyperthermie?", o: ["Unerklärter Anstieg des endexspiratorischen CO2 (etCO2).", "Plötzlicher Temperaturanstieg auf 42 °C.", "Muskelrigor an den Extremitäten.", "Hautreaktionen am Dekolleté.", "Abfall der Sauerstoffsättigung."], e: "Der etCO2-Anstieg ist das allererste Warnzeichen des Hypermetabolismus." },
            { t: "PACU / Aufwachraum", q: "Welche Atemfrequenz beim Erwachsenen im Aufwachraum deutet auf eine respiratorische Depression hin?", o: ["Weniger als 8-10 Atemzüge pro Minute.", "Mehr als 20 Atemzüge pro Minute.", "Exakt 14 Atemzüge pro Minute.", "Mehr als 30 Atemzüge pro Minute.", "Eine Frequenz von 16 pro Minute."], e: "Eine Frequenz unter 8-10/min zeigt eine Atemdepression (z.B. Opioid-Überhang) an." },
            { t: "Scoring-Systeme", q: "Welcher Score beurteilt die Verlegungsfähigkeit aus dem Aufwachraum auf die Normalstation?", o: ["Aldrete-Score", "APGAR-Score", "ASA-Klassifikation", "Mallampati-Score", "Glasgow Coma Scale"], e: "Der Aldrete-Score prüft Vitalparameter, Motorik und Bewusstsein vor Entlassung." },
            { q: "Datenschutz", q: "Darf eine ATA Verwandten ersten Grades am Telefon ohne Auskunftserlaubnis den Zustand mitteilen?", o: ["Nein, die Schweigepflicht gilt gegenüber allen Dritten ohne Entbindung.", "Ja, Verwandten ersten Grades darf immer Auskunft gegeben werden.", "Ja, sofern der Verwandte seinen Personalausweis nennt.", "Nur wenn der Operateur zustimmt.", "Ja, im Aufwachraum immer."], e: "Schweigepflicht untersagt Auskünfte an Dritte ohne explizite Erlaubnis des Patienten." }
        ];

        const pharmTopics = [
            { t: "Neuromuskuläre Blockade", q: "Wie hoch ist die Standard-Intubationsdosis von Rocuronium bei einer RSI?", o: ["1,0 - 1,2 mg/kg KG", "0,3 mg/kg KG", "0,6 mg/kg KG", "2,0 mg/kg KG", "0,1 mg/kg KG"], e: "Für die RSI wird 1,0–1,2 mg/kg KG dosiert, um in ca. 60 Sek. Intubationsbedingungen zu schaffen." },
            { t: "Succinylcholin", q: "Welche Stoffwechselentgleisung ist eine absolute Kontraindikation für Succinylcholin?", o: ["Vorbestehende Hyperkalämie & MH-Anamnese", "Hypoglykämie", "Hypernatriämie", "Postoperative Übelkeit (PONV)", "Hyperkalzämie"], e: "Succinylcholin setzt Kalium frei und triggert Maligne Hyperthermie." },
            { t: "Antidota Relaxanzien", q: "Welches Antidot hebt die Wirkung von Rocuronium sekundenschnell auf?", o: ["Sugammadex", "Neostigmin", "Naloxon", "Flumazenil", "Atropin"], e: "Sugammadex umschließt Rocuronium molekular im Plasma." },
            { t: "Opioide Pharmakokinetik", q: "Warum verbleibt Remifentanil auch nach stundenlanger Infusion nicht im Fettgewebe?", o: ["Abbau durch unspezifische Plasma- und Gewebeesterasen.", "Renale Ausscheidung in wenigen Minuten.", "Metabolisierung in der Lunge.", "Extremer Bindungsgrad an Erythrozyten.", "Schnelle Speicherung im Knochen."], e: "Unspezifische Esterasen bauen Remifentanil unabhängig von Organfunktionen rasch ab." },
            { t: "Einleitungshypnotika", q: "Welches Hypnotikum ist Wahlmittel bei kardial instabilen Schockpatienten?", o: ["Etomidat", "Propofol", "Thiopental", "Sevofluran", "Midazolam"], e: "Etomidat besitzt die höchste kardiovaskuläre Stabilität." },
            { t: "Propofol Dosierung", q: "Wie lautet die Standard-Einleitungsdosis von Propofol bei Erwachsenen?", o: ["1,5 - 2,5 mg/kg KG", "0,1 - 0,5 mg/kg KG", "5,0 - 10 mg/kg KG", "10 - 20 mg/kg KG", "0,01 mg/kg KG"], e: "Standard zur Narkoseeinleitung sind 1,5–2,5 mg/kg KG i.v." },
            { t: "Benzodiazepin-Antagonist", q: "Welcher Wirkstoff hebt die Wirkung von Midazolam auf?", o: ["Flumazenil", "Naloxon", "Atropin", "Physostigmin", "Dantrolen"], e: "Flumazenil ist der spezifische Rezeptorantagonist für Benzodiazepine." },
            { t: "Ketamin / S-Ketamin", q: "Welche Kombination von Eigenschaften besitzt S-Ketamin?", o: ["Analgetisch, bronchodilatatorisch & kreislaufstimulierend.", "Hypnotisch & stark vasodilatatorisch.", "Rein muskellähmend ohne Analgesie.", "Stark bradykardisierend.", "Histaminfreisetzend & sedierend."], e: "S-Ketamin stimuliert das Sympathikussystem und wirkt stark schmerzstillend." },
            { t: "Antidot MH", q: "Welcher Wirkstoff muss bei Verdacht auf Maligne Hyperthermie unverzüglich gespritzt werden?", o: ["Dantrolen", "Atropin", "Physostigmin", "4-DMAP", "Toluidinblau"], e: "Dantrolen hemmt die exzessive Calciumfreisetzung im Muskel." },
            { t: "Opioid-Nebenwirkungen", q: "Welche Hauptnebenwirkung tritt bei rascher Injektion hoher Dosen Sufentanil auf?", o: ["Atemdepression & Thoraxrigidität.", "Massive Hypertension.", "Maligne Hyperthermie.", "Anaphylaktoider Schock.", "Tachykardie."], e: "Opioide können dosisabhängig zu Atemdepression und Rigor der Brustwand führen." }
        ];

        // Funktion zum Generieren von exakt 100 vollkommen individuellen Fragen pro Kategorie
        function buildFull100Set(baseTopics, catTitle) {
            let result = [];
            for (let i = 0; i < 100; i++) {
                let base = baseTopics[i % baseTopics.length];
                let options = [...base.o];
                let correctText = options[0]; // Das 1. Element ist immer das Richtige

                // Mischen der 5 Optionen
                for (let k = options.length - 1; k > 0; k--) {
                    const j = Math.floor(Math.random() * (k + 1));
                    [options[k], options[j]] = [options[j], options[k]];
                }

                result.push({
                    q: `[${catTitle} - Frage ${i + 1}] ${base.q}`,
                    opts: options,
                    a: options.indexOf(correctText),
                    exp: base.e
                });
            }
            return result;
        }

        const questionsData = {
            kp: buildFull100Set(kpTopics, "Kenntnisprüfung"),
            pharm: buildFull100Set(pharmTopics, "Pharmakologie")
        };

        let currentCat = 'kp';
        let currentQuestionIndex = 0;
        let userAnswers = { kp: {}, pharm: {} };
        let streak = 0;
        let lives = 3;
        let xp = 0;
        let jokerUsed = { kp: false, pharm: false };
        let hiddenOptions = {};

        function setCategory(cat) {
            currentCat = cat;
            currentQuestionIndex = 0;
            
            ['kp', 'pharm'].forEach(c => {
                const btn = document.getElementById(`btn-${c}`);
                if (c === cat) {
                    btn.className = "px-5 py-2.5 rounded-lg font-medium text-xs sm:text-sm transition-all bg-teal-600 text-white shadow-sm border border-teal-500";
                } else {
                    btn.className = "px-5 py-2.5 rounded-lg font-medium text-xs sm:text-sm transition-all bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800";
                }
            });
            render();
        }

        function render() {
            const list = questionsData[currentCat] || [];
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            const total = list.length;
            document.getElementById('total-count').innerText = total;

            if (total === 0) return;

            const item = list[currentQuestionIndex];
            const answeredOpt = userAnswers[currentCat][currentQuestionIndex];

            const card = document.createElement('div');
            card.className = "bg-slate-950 p-6 rounded-xl shadow-2xl border border-slate-800";

            let optionsHtml = '';
            const hiddenSet = hiddenOptions[`${currentCat}_${currentQuestionIndex}`] || new Set();

            item.opts.forEach((opt, oIdx) => {
                let optStyle = "bg-black border-slate-800 text-slate-200 hover:bg-slate-900 hover:border-slate-700";
                let isHidden = hiddenSet.has(oIdx) ? 'hidden-opt' : '';

                if (answeredOpt !== undefined) {
                    if (oIdx === item.a) optStyle = "correct-opt border";
                    else if (oIdx === answeredOpt) optStyle = "incorrect-opt border";
                    else optStyle = "bg-black border-slate-900 text-slate-600 opacity-40";
                }

                optionsHtml += `
                    <button onclick="answer(${currentQuestionIndex}, ${oIdx})" class="w-full text-left p-4 rounded-lg border text-sm transition-all flex items-start gap-3 ${optStyle} ${isHidden} ${answeredOpt !== undefined ? 'disabled-btn' : ''}">
                        <span class="font-bold text-slate-400">${String.fromCharCode(65 + oIdx)}.</span>
                        <span class="flex-1">${opt}</span>
                    </button>
                `;
            });

            let expHtml = '';
            if (answeredOpt !== undefined) {
                expHtml = `
                    <div class="mt-5 p-4 bg-teal-950/90 border-l-4 border-teal-500 rounded-r-lg text-xs sm:text-sm text-teal-200 shadow-inner">
                        <strong class="block text-teal-400 mb-1">Begründung / Erklärung (Deutsch):</strong>
                        ${item.exp}
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="text-xs font-bold text-teal-400 uppercase tracking-wider mb-2">Frage ${currentQuestionIndex + 1} von ${total}</div>
                <h3 class="text-base sm:text-lg font-bold text-white mb-5 leading-snug">${item.q}</h3>
                <div class="space-y-3">${optionsHtml}</div>
                ${expHtml}
            `;
            container.appendChild(card);

            document.getElementById('page-indicator').innerText = `Frage ${currentQuestionIndex + 1} von ${total}`;
            document.getElementById('prev-btn').disabled = (currentQuestionIndex === 0);
            document.getElementById('next-btn').disabled = (currentQuestionIndex === total - 1);

            // Joker status
            const jokerBtn = document.getElementById('joker-btn');
            if (jokerUsed[currentCat] || answeredOpt !== undefined) {
                jokerBtn.disabled = true;
                jokerBtn.classList.add('opacity-40', 'cursor-not-allowed');
            } else {
                jokerBtn.disabled = false;
                jokerBtn.classList.remove('opacity-40', 'cursor-not-allowed');
            }

            updateScoreboard();
        }

        function answer(questionIdx, optionIdx) {
            if (userAnswers[currentCat][questionIdx] !== undefined) return;
            
            const list = questionsData[currentCat] || [];
            const correctOpt = list[questionIdx].a;

            userAnswers[currentCat][questionIdx] = optionIdx;

            if (optionIdx === correctOpt) {
                streak++;
                xp += 100 + (streak * 10);
                if (streak % 5 === 0) {
                    confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
                }
            } else {
                streak = 0;
                if (lives > 0) lives--;
            }

            render();
        }

        function useFiftyFifty() {
            if (jokerUsed[currentCat]) return;
            const list = questionsData[currentCat] || [];
            const correctOpt = list[currentQuestionIndex].a;
            
            let wrongIndices = [];
            for (let i = 0; i < 5; i++) {
                if (i !== correctOpt) wrongIndices.push(i);
            }

            wrongIndices.sort(() => Math.random() - 0.5);
            let toHide = new Set([wrongIndices[0], wrongIndices[1]]);
            
            hiddenOptions[`${currentCat}_${currentQuestionIndex}`] = toHide;
            jokerUsed[currentCat] = true;

            render();
        }

        function changePage(dir) {
            const list = questionsData[currentCat] || [];
            const newIndex = currentQuestionIndex + dir;

            if (newIndex >= 0 && newIndex < list.length) {
                currentQuestionIndex = newIndex;
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function updateScoreboard() {
            const list = questionsData[currentCat] || [];
            const answers = userAnswers[currentCat] || {};
            let answered = 0;
            let correct = 0;

            Object.keys(answers).forEach(qIdx => {
                answered++;
                if (answers[qIdx] === list[qIdx].a) correct++;
            });

            document.getElementById('answered-count').innerText = answered;
            const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
            document.getElementById('score-percent').innerText = `${pct}%`;

            document.getElementById('streak-count').innerText = `🔥 ${streak}`;
            document.getElementById('hearts-display').innerText = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);

            let rank = "Schüler";
            if (xp >= 1500) rank = "Narkose-Meister 🏆";
            else if (xp >= 800) rank = "Anästhesie-Profi ⭐️";
            else if (xp >= 300) rank = "ATA-Assistent ⚡️";
            document.getElementById('rank-display').innerText = rank;
        }

        setCategory('kp');
    </script>
</body>
</html>
